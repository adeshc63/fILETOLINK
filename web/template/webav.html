<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta property="og:image" content="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/live.png">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MARVAL ZO | {{file_name}}</title>
<link rel="icon" href="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/logo.png" type="image/x-icon">
<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
<style>
:root {
--primary: #FF3366;
--secondary: #33CCFF;
--accent1: #FFCC00;
--accent2: #66FF99;
--dark: #111111;
--light: #F5F5F5;
--shadow-offset: 4px;
}

* {
margin: 0;
padding: 0;
box-sizing: border-box;
}

body {
font-family: 'Space Grotesk', sans-serif;
background-color: #f0f0f0;
background-image:
radial-gradient(var(--accent1) 2px, transparent 2px),
radial-gradient(var(--secondary) 2px, transparent 2px);
background-size: 30px 30px;
background-position: 0 0, 15px 15px;
color: var(--dark);
padding: 20px 10px;
}

.container {
max-width: 1000px;
margin: 0 auto;
padding: 15px;
}

header {
margin-bottom: 20px;
position: relative;
}

h1 {
font-family: 'Unbounded', cursive;
font-size: 2rem;
font-weight: 900;
text-transform: uppercase;
color: var(--dark);
background-color: var(--accent1);
padding: 12px 20px;
border: 3px solid var(--dark);
box-shadow: var(--shadow-offset) var(--shadow-offset) 0 var(--dark);
display: inline-block;
transform: rotate(-1deg);
margin-bottom: 20px;
max-width: 100%;
overflow: hidden;
text-overflow: ellipsis;
white-space: nowrap;
}

.player-container {
margin-bottom: 25px;
border: 5px solid var(--dark);
box-shadow: var(--shadow-offset) var(--shadow-offset) 0 var(--dark);
background-color: var(--secondary);
padding: 10px;
position: relative;
overflow: hidden;
}

.video-wrapper {
position: relative;
width: 100%;
background-color: #000;
border: 3px solid var(--dark);
overflow: hidden;
}

.plyr {
width: 100%;
max-height: 75vh;
}

.plyr--video {
border-radius: 0;
}

.plyr--fullscreen-enabled [data-plyr=fullscreen] {
display: inline-block !important;
}

.plyr__control--overlaid {
background: var(--primary);
border: 2px solid var(--dark);
box-shadow: 3px 3px 0 var(--dark);
}

.plyr__control--overlaid:hover {
background: var(--accent1);
transform: scale(1.1);
}

.plyr--full-ui input[type=range] {
color: var(--primary);
}

.plyr__control.plyr__tab-focus,
.plyr__control:hover,
.plyr__control[aria-expanded=true] {
background: var(--accent1);
}

.controls {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 15px;
margin-bottom: 20px;
}

.btn {
font-family: 'Unbounded', cursive;
font-weight: 700;
font-size: 1rem;
padding: 15px 20px;
border: 3px solid var(--dark);
box-shadow: var(--shadow-offset) var(--shadow-offset) 0 var(--dark);
background-color: white;
cursor: pointer;
transition: all 0.2s ease;
display: flex;
align-items: center;
justify-content: center;
gap: 10px;
text-transform: uppercase;
}

.btn:active {
box-shadow: 1px 1px 0 var(--dark);
transform: translate(3px, 3px);
}

.download {
background-color: var(--accent2);
}

.copy-link {
background-color: var(--secondary);
}

.player-options {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
gap: 15px;
margin-bottom: 30px;
}

.player-btn {
font-family: 'Space Grotesk', sans-serif;
font-weight: 700;
font-size: 0.9rem;
padding: 12px 15px;
border: 3px solid var(--dark);
box-shadow: var(--shadow-offset) var(--shadow-offset) 0 var(--dark);
cursor: pointer;
transition: all 0.2s ease;
display: flex;
align-items: center;
justify-content: center;
gap: 8px;
background-color: white;
}

.player-btn:nth-child(1) {
background-color: #fb7e01;
}

.player-btn:nth-child(2) {
background-color: #7EB5FF;
}

.player-btn:nth-child(3) {
background-color: #ffcc66;
}

.player-btn:nth-child(4) {
background-color: #ff99cc;
}

.player-btn:nth-child(5) {
background-color: #66ccff;
}

.player-btn:active {
box-shadow: 1px 1px 0 var(--dark);
transform: translate(3px, 3px);
}

.player-logo {
width: 24px;
height: 24px;
object-fit: contain;
border-radius: 0;
}

.social-links {
display: flex;
justify-content: center;
gap: 20px;
margin-top: 20px;
padding: 20px;
background-color: var(--primary);
border: 3px solid var(--dark);
box-shadow: var(--shadow-offset) var(--shadow-offset) 0 var(--dark);
}

.social-links a {
display: flex;
align-items: center;
justify-content: center;
width: 50px;
height: 50px;
background-color: white;
border: 3px solid var(--dark);
border-radius: 10px;
box-shadow: 3px 3px 0 var(--dark);
transition: all 0.2s ease;
}

.social-links a:hover {
transform: translateY(-5px);
}

.social-links a:active {
box-shadow: 1px 1px 0 var(--dark);
transform: translate(2px, 2px);
}

.social-links img {
width: 30px;
height: 30px;
object-fit: contain;
}

.feedback {
position: fixed;
bottom: 20px;
left: 50%;
transform: translateX(-50%);
background-color: var(--accent1);
color: var(--dark);
padding: 15px 25px;
border: 3px solid var(--dark);
box-shadow: var(--shadow-offset) var(--shadow-offset) 0 var(--dark);
font-family: 'Unbounded', cursive;
font-weight: 700;
border-radius: 0;
z-index: 1000;
animation: popIn 0.3s ease-out;
}

@keyframes popIn {
0% { transform: translateX(-50%) scale(0.8); opacity: 0; }
70% { transform: translateX(-50%) scale(1.1); }
100% { transform: translateX(-50%) scale(1); opacity: 1; }
}

@media (max-width: 768px) {
h1 {
font-size: 1.5rem;
padding: 10px 15px;
}

.controls {
grid-template-columns: 1fr;
}

.player-options {
grid-template-columns: 1fr 1fr;
}

.social-links {
flex-wrap: wrap;
}
}

.copyright {
text-align: center;
margin-top: 20px;
font-size: 0.8rem;
font-weight: 500;
color: var(--dark);
opacity: 0.7;
}
</style>
</head>
<body>
<div class="container">
<header>
<h1 id="file-name">{{file_name}}</h1>
</header>

<div class="player-container">
<div class="video-wrapper">
<video class="plyr" controls crossorigin playsinline poster="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/well.png">
 <source src="{{file_url}}" type="video/mp4">
Your browser does not support the video tag.
</video>
</div>
</div>

<div class="controls">
<button class="btn download" onclick="download()">
<i class="fas fa-cloud-download-alt"></i> Download Now
</button>
<button class="btn copy-link" onclick="copyLink()">
<i class="fas fa-link"></i> Copy Direct Link
</button>
</div>

<div class="player-options">
<button class="player-btn" onclick="playOnline('vlc')">
<img src="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/vlc.png" alt="VLC Mobile" class="player-logo">
VLC Mobile
</button>
<button class="player-btn" onclick="playOnline('mx')">
<img src="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/mx.png" alt="MX Player" class="player-logo">
MX Player
</button>
<button class="player-btn" onclick="playOnline('np')">
<img src="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/nPlayer.webp" alt="nPlayer" class="player-logo">
nPlayer
</button>
<button class="player-btn" onclick="playOnline('sp')">
<img src="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/splayer.webp" alt="S Player" class="player-logo">
S Player
</button>
<button class="player-btn" onclick="playOnline('km')">
<img src="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/km.webp" alt="KM Player" class="player-logo">
KM Player
</button>
</div>

<div class="social-links">
<a href="http://youtube.com/@avbotx" aria-label="YouTube">
<img src="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/youtube.png" alt="YouTube">
</a>
<a href="http://GitHub.com/Botsthe" aria-label="GitHub">
<img src="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/github.png" alt="GitHub">
</a>
<a href="http://t.me/BOT_OWNER26" aria-label="Telegram">
<img src="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/telegram.png" alt="Telegram">
</a>
<a href="https://www.instagram.com/aman_developerr" aria-label="Instagram">
<img src="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/instagram.png" alt="Instagram">
</a>
</div>

<div class="copyright">
© marvalzi | @Marvalzod | @drdoom
</div>
</div>

<script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    const urlParams = new URLSearchParams(window.location.search);
    const fileUrl = urlParams.get('url') || '{{file_url}}';
    const fileName = urlParams.get('name') || '{{file_name}}';
    
    if (urlParams.has('name')) {
        document.getElementById('file-name').textContent = fileName;
        document.title = `MARVAL ZO | ${fileName}`;
    }
    
    const videoSource = document.querySelector('.plyr source');
    if (urlParams.has('url') && videoSource) {
        videoSource.src = fileUrl;
    }
    
    const player = new Plyr('.plyr', {
        controls: [
            'play-large', 'play', 'progress', 'current-time', 'mute',
            'volume', 'captions', 'settings', 'pip', 'airplay', 'fullscreen'
        ],
        fullscreen: { 
            enabled: true,
            fallback: true,
            iosNative: true,
            container: null  // Allow fullscreen on entire page
        },
        ratio: '16:9',
        clickToPlay: true
    });
    
    // Enhanced fullscreen handling
    player.on('enterfullscreen', () => {
        const playerContainer = document.querySelector('.player-container');
        const videoWrapper = document.querySelector('.video-wrapper');
        
        // Add fullscreen classes for extra control
        playerContainer.classList.add('fullscreen-active');
        videoWrapper.classList.add('fullscreen-active');
        
        // Force fullscreen styles
        document.body.style.overflow = 'hidden';
        
        // Additional fullscreen fix for stubborn browsers
        setTimeout(() => {
            const plyrElement = document.querySelector('.plyr');
            if (plyrElement) {
                plyrElement.style.position = 'fixed';
                plyrElement.style.top = '0';
                plyrElement.style.left = '0';
                plyrElement.style.width = '100vw';
                plyrElement.style.height = '100vh';
                plyrElement.style.zIndex = '9999';
                plyrElement.style.background = '#000';
            }
        }, 100);
    });
    
    player.on('exitfullscreen', () => {
        const playerContainer = document.querySelector('.player-container');
        const videoWrapper = document.querySelector('.video-wrapper');
        
        // Remove fullscreen classes
        playerContainer.classList.remove('fullscreen-active');
        videoWrapper.classList.remove('fullscreen-active');
        
        // Restore body overflow
        document.body.style.overflow = '';
        
        // Reset plyr styles
        setTimeout(() => {
            const plyrElement = document.querySelector('.plyr');
            if (plyrElement) {
                plyrElement.style.position = '';
                plyrElement.style.top = '';
                plyrElement.style.left = '';
                plyrElement.style.width = '';
                plyrElement.style.height = '';
                plyrElement.style.zIndex = '';
                plyrElement.style.background = '';
            }
        }, 100);
    });
    
    const video = document.querySelector('video');
    if (video) {
        video.load();
        
        // Additional fullscreen support using native API
        video.addEventListener('dblclick', () => {
            if (!document.fullscreenElement) {
                if (video.requestFullscreen) {
                    video.requestFullscreen();
                } else if (video.webkitRequestFullscreen) {
                    video.webkitRequestFullscreen();
                } else if (video.msRequestFullscreen) {
                    video.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            }
        });
    }
});

function getDirectUrl() {
    const urlParams = new URLSearchParams(window.location.search);
    const fileUrl = urlParams.get('url') || '{{file_url}}';
    return fileUrl;
}

function getFileName() {
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get('name') || '{{file_name}}';
}

function showFeedback(message) {
    const feedback = document.createElement('div');
    feedback.className = 'feedback';
    feedback.textContent = message;
    feedback.setAttribute("role", "alert");
    document.body.appendChild(feedback);
    setTimeout(() => feedback.remove(), 3000);
}

function playOnline(player) {
    const directUrl = getDirectUrl();
    const fileName = getFileName();
    
    // Validate URL
    if (!directUrl || directUrl === '{{file_url}}') {
        showFeedback('❌ Video URL not found!');
        return;
    }
    
    let playerUrl;
    
    switch(player) {
        case 'vlc':
            // VLC for Android
            playerUrl = `vlc://${directUrl}`;
            break;
            
        case 'mx':
            // MX Player - Updated intent format
            playerUrl = `intent:${directUrl}#Intent;type=video/*;package=com.mxtech.videoplayer.ad;S.title=${encodeURIComponent(fileName)};end`;
            break;
            
        case 'np':
            // nPlayer
            playerUrl = `nplayer-${directUrl}`;
            break;
            
        case 'sp':
            // S Player (Simple Player)
            playerUrl = `intent:${directUrl}#Intent;action=android.intent.action.VIEW;type=video/*;package=com.young.simple.player;S.title=${encodeURIComponent(fileName)};end`;
            break;
            
        case 'km':
            // KM Player
            playerUrl = `intent:${directUrl}#Intent;action=android.intent.action.VIEW;type=video/*;package=com.kmplayer;S.title=${encodeURIComponent(fileName)};end`;
            break;
            
        default:
            playerUrl = directUrl;
    }
    
    try {
        showFeedback(`🎬 Opening in ${getPlayerName(player)}...`);
        
        // Create a temporary link for better compatibility
        const link = document.createElement('a');
        link.href = playerUrl;
        link.target = '_blank';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        
        // Fallback for MX Player if the first attempt doesn't work
        if (player === 'mx') {
            setTimeout(() => {
                // Try MX Player Pro as fallback
                const fallbackUrl = `intent:${directUrl}#Intent;type=video/*;package=com.mxtech.videoplayer.pro;S.title=${encodeURIComponent(fileName)};end`;
                const fallbackLink = document.createElement('a');
                fallbackLink.href = fallbackUrl;
                fallbackLink.target = '_blank';
                document.body.appendChild(fallbackLink);
                fallbackLink.click();
                document.body.removeChild(fallbackLink);
            }, 1500);
        }
        
    } catch (error) {
        console.error('Error opening external player:', error);
        showFeedback('❌ Could not open external player');
        
        // Final fallback - open direct URL
        setTimeout(() => {
            window.open(directUrl, '_blank');
        }, 1000);
    }
}

function getPlayerName(player) {
    const names = {
        'vlc': 'VLC Mobile',
        'mx': 'MX Player',
        'np': 'nPlayer',
        'sp': 'S Player',
        'km': 'KM Player'
    };
    return names[player] || 'External Player';
}

function download() {
    const directUrl = getDirectUrl();
    const fileName = getFileName();
    
    if (!directUrl || directUrl === '{{file_url}}') {
        showFeedback('❌ Download URL not found!');
        return;
    }
    
    try {
        // Method 1: Try direct download
        const a = document.createElement('a');
        a.href = directUrl;
        a.download = fileName;
        a.target = '_blank';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        
        showFeedback('📥 Download started!');
        
    } catch (error) {
        console.error('Download error:', error);
        // Fallback: Open in new tab
        window.open(directUrl, '_blank');
        showFeedback('📥 Opening download link...');
    }
}

function copyLink() {
    const directUrl = getDirectUrl();
    
    if (!directUrl || directUrl === '{{file_url}}') {
        showFeedback('❌ Link not found!');
        return;
    }
    
    if (navigator.clipboard && window.isSecureContext) {
        // Modern approach
        navigator.clipboard.writeText(directUrl)
        .then(() => {
            showFeedback('📋 Link copied to clipboard!');
        })
        .catch(() => {
            fallbackCopy(directUrl);
        });
    } else {
        // Fallback for older browsers or non-HTTPS
        fallbackCopy(directUrl);
    }
}

function fallbackCopy(text) {
    const textarea = document.createElement('textarea');
    textarea.value = text;
    textarea.style.position = 'fixed';
    textarea.style.left = '-999999px';
    textarea.style.top = '-999999px';
    document.body.appendChild(textarea);
    textarea.focus();
    textarea.select();
    
    try {
        document.execCommand('copy');
        showFeedback('📋 Link copied to clipboard!');
    } catch (err) {
        console.error('Could not copy text:', err);
        showFeedback('❌ Could not copy link');
    }
    
    document.body.removeChild(textarea);
}
</script>
</body>
</html>
