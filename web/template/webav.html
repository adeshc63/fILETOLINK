<!DOCTYPE html> 
<html lang="en"> 
<head> 
<meta charset="UTF-8"> 
<meta property="og:image" content="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/live.png"> 
<meta http-equiv="X-UA-Compatible" content="IE=edge"> 
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"> 
<title>MARVAL ZO | {{file_name}}</title> 
<link rel="icon" href="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/logo.png" type="image/x-icon"> 
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"> 
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet"> 
<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.6/shaka-player.compiled.js"></script>
<style> 
:root { 
--primary: #FF3366; 
--secondary: #33CCFF; 
--accent1: #FFCC00; 
--accent2: #66FF99; 
--dark: #111111; 
--light: #F5F5F5; 
--shadow-offset: 4px; 
} 
 
* { 
margin: 0; 
padding: 0; 
box-sizing: border-box; 
} 
 
body { 
font-family: 'Space Grotesk', sans-serif; 
background-color: #f0f0f0; 
background-image: 
radial-gradient(var(--accent1) 2px, transparent 2px), 
radial-gradient(var(--secondary) 2px, transparent 2px); 
background-size: 30px 30px; 
background-position: 0 0, 15px 15px; 
color: var(--dark); 
padding: 20px 10px; 
} 
 
.container { 
max-width: 1000px; 
margin: 0 auto; 
padding: 15px; 
} 
 
header { 
margin-bottom: 20px; 
position: relative; 
} 
 
h1 { 
font-family: 'Unbounded', cursive; 
font-size: 2rem; 
font-weight: 900; 
text-transform: uppercase; 
color: var(--dark); 
background-color: var(--accent1); 
padding: 12px 20px; 
border: 3px solid var(--dark); 
box-shadow: var(--shadow-offset) var(--shadow-offset) 0 var(--dark); 
display: inline-block; 
transform: rotate(-1deg); 
margin-bottom: 20px; 
max-width: 100%; 
overflow: hidden; 
text-overflow: ellipsis; 
white-space: nowrap; 
} 
 
.player-container { 
margin-bottom: 25px; 
border: 5px solid var(--dark); 
box-shadow: var(--shadow-offset) var(--shadow-offset) 0 var(--dark); 
background-color: var(--secondary); 
padding: 10px; 
position: relative; 
overflow: hidden; 
} 
 
.video-wrapper { 
position: relative; 
width: 100%; 
background-color: #000; 
border: 3px solid var(--dark); 
} 

/* Shaka Player Custom Styling */
#video-container {
width: 100% !important;
position: relative;
}

#video {
width: 100% !important;
height: 0 !important;
padding-top: 56.25% !important; /* 16:9 Aspect Ratio */
max-height: 75vh !important;
background-color: #000;
}

.shaka-controls-container {
position: absolute;
bottom: 0;
left: 0;
right: 0;
}

.shaka-big-play-button {
position: absolute;
left: 50%;
top: 50%;
transform: translate(-50%, -50%);
font-size: 3em !important;
line-height: 2em !important;
height: 2em !important;
width: 2em !important;
border-radius: 50% !important;
background-color: var(--primary);
border: 2px solid var(--dark);
box-shadow: 3px 3px 0 var(--dark);
cursor: pointer;
display: flex;
align-items: center;
justify-content: center;
z-index: 100;
color: white;
transition: all 0.2s ease;
}

.shaka-big-play-button:hover {
background-color: var(--accent1);
transform: translate(-50%, -50%) scale(1.1);
}

/* Custom Shaka Controls Style */
.shaka-controls-button-panel {
padding: 10px;
}

.shaka-bottom-controls {
padding: 8px;
background: linear-gradient(transparent, rgba(0,0,0,0.7));
}

/* Settings icon for mobile */
#custom-settings-button {
position: absolute;
right: 15px;
top: 15px;
font-size: 24px;
color: white;
background: rgba(0,0,0,0.5);
border-radius: 50%;
padding: 8px;
cursor: pointer;
z-index: 100;
}

/* Custom settings menu */
.shaka-settings-menu {
position: absolute;
bottom: 60px;
right: 10px;
background-color: rgba(0, 0, 0, 0.8);
padding: 10px;
border-radius: 5px;
color: white;
z-index: 200;
display: none;
}

.settings-header {
font-weight: bold;
margin-bottom: 5px;
}

.settings-item {
padding: 5px;
cursor: pointer;
}

.settings-item.active {
background-color: rgba(255, 51, 102, 0.5);
}

.settings-close {
padding: 5px;
margin-top: 10px;
text-align: center;
cursor: pointer;
background-color: rgba(255, 51, 102, 0.5);
border-radius: 3px;
}

.controls { 
display: grid; 
grid-template-columns: 1fr 1fr; 
gap: 15px; 
margin-bottom: 20px; 
} 
 
.btn { 
font-family: 'Unbounded', cursive; 
font-weight: 700; 
font-size: 1rem; 
padding: 15px 20px; 
border: 3px solid var(--dark); 
box-shadow: var(--shadow-offset) var(--shadow-offset) 0 var(--dark); 
background-color: white; 
cursor: pointer; 
transition: all 0.2s ease; 
display: flex; 
align-items: center; 
justify-content: center; 
gap: 10px; 
text-transform: uppercase; 
} 
 
.btn:active { 
box-shadow: 1px 1px 0 var(--dark); 
transform: translate(3px, 3px); 
} 
 
.download { 
background-color: var(--accent2); 
} 
 
.copy-link { 
background-color: var(--secondary); 
} 
 
.player-options { 
display: grid; 
grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); 
gap: 15px; 
margin-bottom: 30px; 
} 
 
.player-btn { 
font-family: 'Space Grotesk', sans-serif; 
font-weight: 700; 
font-size: 0.9rem; 
padding: 12px 15px; 
border: 3px solid var(--dark); 
box-shadow: var(--shadow-offset) var(--shadow-offset) 0 var(--dark); 
cursor: pointer; 
transition: all 0.2s ease; 
display: flex; 
align-items: center; 
justify-content: center; 
gap: 8px; 
background-color: white; 
} 
 
.player-btn:nth-child(1) { 
background-color: #fb7e01; 
} 
 
.player-btn:nth-child(2) { 
background-color: #7EB5FF; 
} 
 
.player-btn:nth-child(3) { 
background-color: #ffcc66; 
} 
 
.player-btn:nth-child(4) { 
background-color: #ff99cc; 
} 
 
.player-btn:nth-child(5) { 
background-color: #66ccff; 
} 
 
.player-btn:active { 
box-shadow: 1px 1px 0 var(--dark); 
transform: translate(3px, 3px); 
} 
 
.player-logo { 
width: 24px; 
height: 24px; 
object-fit: contain; 
border-radius: 0; 
} 
 
.social-links { 
display: flex; 
justify-content: center; 
gap: 20px; 
margin-top: 20px; 
padding: 20px; 
background-color: var(--primary); 
border: 3px solid var(--dark); 
box-shadow: var(--shadow-offset) var(--shadow-offset) 0 var(--dark); 
} 
 
.social-links a { 
display: flex; 
align-items: center; 
justify-content: center; 
width: 50px; 
height: 50px; 
background-color: white; 
border: 3px solid var(--dark); 
border-radius: 10px; 
box-shadow: 3px 3px 0 var(--dark); 
transition: all 0.2s ease; 
} 
 
.social-links a:hover { 
transform: translateY(-5px); 
} 
 
.social-links a:active { 
box-shadow: 1px 1px 0 var(--dark); 
transform: translate(2px, 2px); 
} 
 
.social-links img { 
width: 30px; 
height: 30px; 
object-fit: contain; 
} 
 
.feedback { 
position: fixed; 
bottom: 20px; 
left: 50%; 
transform: translateX(-50%); 
background-color: var(--accent1); 
color: var(--dark); 
padding: 15px 25px; 
border: 3px solid var(--dark); 
box-shadow: var(--shadow-offset) var(--shadow-offset) 0 var(--dark); 
font-family: 'Unbounded', cursive; 
font-weight: 700; 
border-radius: 0; 
z-index: 1000; 
animation: popIn 0.3s ease-out; 
} 
 
@keyframes popIn { 
0% { transform: translateX(-50%) scale(0.8); opacity: 0; } 
70% { transform: translateX(-50%) scale(1.1); } 
100% { transform: translateX(-50%) scale(1); opacity: 1; } 
} 
 
@media (max-width: 768px) { 
h1 { 
font-size: 1.5rem; 
padding: 10px 15px; 
} 
 
.controls { 
grid-template-columns: 1fr; 
} 
 
.player-options { 
grid-template-columns: 1fr 1fr; 
} 
 
.social-links { 
flex-wrap: wrap; 
} 
} 
 
.copyright { 
text-align: center; 
margin-top: 20px; 
font-size: 0.8rem; 
font-weight: 500; 
color: var(--dark); 
opacity: 0.7; 
} 
</style> 
</head> 
<body> 
<div class="container"> 
<header> 
<h1 id="file-name">{{file_name}}</h1> 
</header> 
 
<div class="player-container"> 
<div class="video-wrapper"> 
  <div id="video-container">
    <video id="video" poster="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/well.png" playsinline></video>
    <div class="shaka-big-play-button" id="big-play-button">
      <i class="fas fa-play"></i>
    </div>
    <div id="custom-settings-button">
      <i class="fas fa-cog"></i>
    </div>
    <div class="shaka-settings-menu" id="settings-menu"></div>
  </div>
</div> 
</div> 
 
<div class="controls"> 
<button class="btn download" onclick="download()"> 
<i class="fas fa-cloud-download-alt"></i> Download Now 
</button> 
<button class="btn copy-link" onclick="copyLink()"> 
<i class="fas fa-link"></i> Copy Direct Link

</div> 
 
<div class="player-options"> 
<button class="player-btn" onclick="playOnline('vlc')"> 
<img src="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/vlc.png" alt="VLC Mobile" class="player-logo"> 
VLC Mobile 
</button> 
<button class="player-btn" onclick="playOnline('mx')"> 
<img src="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/mx.png" alt="MX Player" class="player-logo"> 
MX Player 
</button> 
<button class="player-btn" onclick="playOnline('np')"> 
<img src="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/nPlayer.webp" alt="nPlayer" class="player-logo"> 
nPlayer 
</button> 
<button class="player-btn" onclick="playOnline('sp')"> 
<img src="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/splayer.webp" alt="S Player" class="player-logo"> 
S Player 
</button> 
<button class="player-btn" onclick="playOnline('km')"> 
<img src="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/km.webp" alt="KM Player" class="player-logo"> 
KM Player

<div class="social-links">

<div class="copyright"> 
© marvalzi | @Marvalzod | @drdoom

<script> 
document.addEventListener('DOMContentLoaded', () => { 
  // Initialize Shaka Player
  const videoElement = document.getElementById('video');
  const bigPlayButton = document.getElementById('big-play-button');
  const videoUrl = '{{file_url}}';
  
  // Check if the browser supports the Shaka Player
  if (!shaka.Player.isBrowserSupported()) {
    console.error('Browser not supported for Shaka Player!');
    alert('Your browser is not supported for video playback. Please try a modern browser like Chrome, Firefox, or Edge.');
    return;
  }
  
  // Create Shaka Player instance
  const player = new shaka.Player(videoElement);
  
  // Configure Shaka Player
  const config = {
    streaming: {
      bufferingGoal: 30,
      rebufferingGoal: 2,
      bufferBehind: 30,
      retryParameters: {
        maxAttempts: 5,
        baseDelay: 1000,
        backoffFactor: 2,
        fuzzFactor: 0.5
      }
    },
    manifest: {
      retryParameters: {
        maxAttempts: 5,
        baseDelay: 1000,
        backoffFactor: 2,
        fuzzFactor: 0.5
      }
    },
    abr: {
      enabled: true,
      defaultBandwidthEstimate: 1000000
    },
    preferredAudioLanguage: 'en',
    preferredTextLanguage: 'en'
  };
  
  player.configure(config);
  
  // Error handling
  player.addEventListener('error', (event) => {
    console.error('Error code', event.detail.code, 'object', event.detail);
    showFeedback('Error loading video. Please try again.');
  });
  
  // Setup UI and controls
  const ui = setupShakaPlayerUI();
  
  // Load the video
  function initPlayer() {
    player.load(videoUrl).then(() => {
      console.log('Video loaded successfully');
      // Get available tracks
      const tracks = player.getVariantTracks();
      console.log('Available video tracks:', tracks);
      
      // Setup quality options in the settings menu
      setupQualitySettings(tracks);
      
      // Handle audio tracks if available
      const audioTracks = player.getAudioLanguagesAndRoles();
      if (audioTracks && audioTracks.length > 1) {
        setupAudioSettings(audioTracks);
      }
      
    }).catch((error) => {
      console.error('Error loading the video:', error);
      showFeedback('Failed to load video. Please try again.');
    });
  }
  
  // Initialize the player
  initPlayer();
  
  // Setup Shaka Player UI
  function setupShakaPlayerUI() {
    // Handle big play button click
    bigPlayButton.addEventListener('click', () => {
      videoElement.play();
      bigPlayButton.style.display = 'none';
    });
    
    // Hide big play button when play starts
    videoElement.addEventListener('play', () => {
      bigPlayButton.style.display = 'none';
    });
    
    // Show big play button when paused
    videoElement.addEventListener('pause', () => {
      if (!videoElement.ended) {
        bigPlayButton.style.display = 'flex';
      }
    });
    
    // Handle video end
    videoElement.addEventListener('ended', () => {
      bigPlayButton.style.display = 'flex';
      bigPlayButton.innerHTML = '<i class="fas fa-redo"></i>';
    });
    
    // Handle fullscreen
    videoElement.addEventListener('dblclick', toggleFullScreen);
    
    // Handle touch events for mobile
    setupMobileTouchEvents();
    
    // Setup settings button
    const settingsButton = document.getElementById('custom-settings-button');
    const settingsMenu = document.getElementById('settings-menu');
    
    settingsButton.addEventListener('click', () => {
      if (settingsMenu.style.display === 'block') {
        settingsMenu.style.display = 'none';
      } else {
        settingsMenu.style.display = 'block';
        populateSettingsMenu();
      }
    });
    
    // Close settings menu when clicking outside
    document.addEventListener('click', (e) => {
      if (e.target !== settingsButton && !settingsMenu.contains(e.target) && settingsMenu.style.display === 'block') {
        settingsMenu.style.display = 'none';
      }
    });
    
    return {
      settingsMenu,
      settingsButton
    };
  }
  
  // Setup mobile touch events for seeking
  function setupMobileTouchEvents() {
    let lastTap = 0;
    let touchTimeout;
    
    videoElement.addEventListener('touchend', (e) => {
      const currentTime = new Date().getTime();
      const tapPosition = e.changedTouches[0].clientX;
      const playerWidth = videoElement.offsetWidth;
      
      clearTimeout(touchTimeout);
      
      if (currentTime - lastTap < 300) {
        // Double tap detected
        if (tapPosition < playerWidth / 2) {
          // Left side - rewind 10 seconds
          videoElement.currentTime = Math.max(0, videoElement.currentTime - 10);
        } else {
          // Right side - forward 10 seconds
          videoElement.currentTime = Math.min(videoElement.duration, videoElement.currentTime + 10);
        }
        e.preventDefault();
      }
      
      lastTap = currentTime;
    });
  }
  
  // Toggle fullscreen function
  function toggleFullScreen() {
    if (!document.fullscreenElement) {
      if (videoElement.requestFullscreen) {
        videoElement.requestFullscreen();
      } else if (videoElement.webkitRequestFullscreen) {
        videoElement.webkitRequestFullscreen();
      } else if (videoElement.msRequestFullscreen) {
        videoElement.msRequestFullscreen();
      }
    } else {
      if (document.exitFullscreen) {
        document.exitFullscreen();
      } else if (document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
      } else if (document.msExitFullscreen) {
        document.msExitFullscreen();
      }
    }
  }
  
  // Populate the settings menu with quality options
  function populateSettingsMenu() {
    const settingsMenu = document.getElementById('settings-menu');
    settingsMenu.innerHTML = ''; // Clear previous items
    
    // Add playback speed options
    const speedHeader = document.createElement('div');
    speedHeader.className = 'settings-header';
    speedHeader.textContent = 'Playback Speed';
    settingsMenu.appendChild(speedHeader);
    
    const speeds = [0.5, 0.75, 1, 1.25, 1.5, 2];
    speeds.forEach(speed => {
      const speedItem = document.createElement('div');
      speedItem.className = 'settings-item';
      speedItem.textContent = speed === 1 ? 'Normal' : `${speed}x`;
      if (videoElement.playbackRate === speed) {
        speedItem.classList.add('active');
      }
      
      speedItem.addEventListener('click', () => {
        videoElement.playbackRate = speed;
        document.querySelectorAll('.settings-item').forEach(item => {
          item.classList.remove('active');
        });
        speedItem.classList.add('active');
      });
      
      settingsMenu.appendChild(speedItem);
    });
    
    // Add close button
    const closeButton = document.createElement('div');
    closeButton.className = 'settings-close';
    closeButton.textContent = 'Close';
    closeButton.addEventListener('click', () => {
      settingsMenu.style.display = 'none';
    });
    
    settingsMenu.appendChild(closeButton);
  }
  
  // Setup quality settings
  function setupQualitySettings(tracks) {
    if (!tracks || tracks.length <= 1) return;
    
    // Sort tracks by height (resolution)
    tracks.sort((a, b) => b.height - a.height);
    
    const settingsMenu = document.getElementById('settings-menu');
    
    // Add quality header to settings menu
    const qualityHeader = document.createElement('div');
    qualityHeader.className = 'settings-header';
    qualityHeader.textContent = 'Quality';
    settingsMenu.appendChild(qualityHeader);
    
    // Add auto quality option
    const autoItem = document.createElement('div');
    autoItem.className = 'settings-item active';
    autoItem.textContent = 'Auto';
    autoItem.addEventListener('click', () => {
      player.configure({abr: {enabled: true}});
      document.querySelectorAll('.quality-item').forEach(item => {
        item.classList.remove('active');
      });
      autoItem.classList.add('active');
    });
    settingsMenu.appendChild(autoItem);
    
    // Add each quality option
    tracks.forEach(track => {
      const qualityItem = document.createElement('div');
      qualityItem.className = 'settings-item quality-item';
      qualityItem.textContent = `${track.height}p`;
      
      qualityItem.addEventListener('click', () => {
        // Disable ABR for manual selection
        player.configure({abr: {enabled: false}});
        // Select this track
        player.selectVariantTrack(track, true);
        
        // Update active state
        document.querySelectorAll('.quality-item').forEach(item => {
          item.classList.remove('active');
        });
        autoItem.classList.remove('active');
        qualityItem.classList.add('active');
      });
      
      settingsMenu.appendChild(qualityItem);
    });
  }
  
  // Setup audio settings
  function setupAudioSettings(audioTracks) {
    if (!audioTracks || audioTracks.length <= 1) return;
    
    const settingsMenu = document.getElementById('settings-menu');
    
    // Add audio header to settings menu
    const audioHeader = document.createElement('div');
    audioHeader.className = 'settings-header';
    audioHeader.textContent = 'Audio';
    settingsMenu.appendChild(audioHeader);
    
    // Add each audio track option
    audioTracks.forEach((track, index) => {
      const audioItem = document.createElement('div');
      audioItem.className = 'settings-item audio-item';
      audioItem.textContent = track.language || `Track ${index+1}`;
      
      audioItem.addEventListener('click', () => {
        // Select this audio track
        player.selectAudioLanguage(track.language);
        
        // Update active state
        document.querySelectorAll('.audio-item').forEach(item => {
          item.classList.remove('active');
        });
        audioItem.classList.add('active');
      });
      
      settingsMenu.appendChild(audioItem);
    });
  }
}); 
 
const currentUrl = window.location.href; 
const finalUrl = currentUrl.replace("/watch/", "/dl/"); 
 
function playOnline(player) { 
const playerUrls = { 
vlc: `vlc://${finalUrl}`, 
mxp: `intent:${finalUrl}#Intent;package=com.mxtech.videoplayer.pro;end`, 
mx: `intent:${finalUrl}#Intent;package=com.mxtech.videoplayer.ad;end`, 
np: `nplayer-${finalUrl}`, 
sp: `intent:${finalUrl}#Intent;action=com.young.simple.player.playback_online;package=com.young.simple.player;end`, 
km: `intent:${finalUrl}#Intent;package=com.kmplayer;end` 
}; 
window.location.href = playerUrls[player] || finalUrl; 
} 
 
function download() { 
window.location.href = finalUrl; 
} 
 
function copyLink() { 
navigator.clipboard.writeText(finalUrl) 
.then(() => { 
  showFeedback("📋 Link copied to clipboard!");
}) 
.catch(err => {
  console.error('Failed to copy link: ', err);
  showFeedback("❌ Failed to copy link. Please try again.");
});
}

function showFeedback(message) {
  // Remove any existing feedback
  const existingFeedback = document.querySelector('.feedback');
  if (existingFeedback) {
    existingFeedback.remove();
  }
  
  // Create and show new feedback
  const feedback = document.createElement('div');
  feedback.className = 'feedback';
  feedback.textContent = message;
  feedback.setAttribute("role", "alert");
  document.body.appendChild(feedback);
  
  // Auto remove after 3 seconds
  setTimeout(() => {
    feedback.remove();
  }, 3000);
}
</script> 
</body>
