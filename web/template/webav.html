<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta property="og:image" content="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/live.png">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MARVEL ZONE | Epic Video Experience</title>
    <link rel="icon" href="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/logo.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Roboto:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --marvel-red: #FF0000;
            --marvel-blue: #0066FF;
            --marvel-gold: #FFD700;
            --marvel-purple: #8B00FF;
            --marvel-green: #00FF41;
            --dark-bg: #0A0A0F;
            --darker-bg: #050508;
            --neon-glow: 0 0 20px;
        }

        body {
            font-family: 'Orbitron', monospace;
            background: linear-gradient(135deg, var(--darker-bg) 0%, var(--dark-bg) 50%, #1a0033 100%);
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 20%, var(--marvel-red)22 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, var(--marvel-blue)22 0%, transparent 50%),
                radial-gradient(circle at 60% 10%, var(--marvel-purple)22 0%, transparent 50%);
            opacity: 0.1;
            z-index: -1;
            animation: colorShift 10s ease-in-out infinite alternate;
        }

        @keyframes colorShift {
            0% { transform: rotate(0deg) scale(1); }
            100% { transform: rotate(360deg) scale(1.1); }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
        }

        .marvel-logo {
            font-size: 4rem;
            font-weight: 900;
            background: linear-gradient(45deg, var(--marvel-red), var(--marvel-gold), var(--marvel-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(255, 0, 0, 0.5);
            letter-spacing: 8px;
            margin-bottom: 10px;
            animation: marvelGlow 3s ease-in-out infinite alternate;
            transform: perspective(300px) rotateX(15deg);
        }

        @keyframes marvelGlow {
            0% { filter: drop-shadow(0 0 10px var(--marvel-red)); }
            50% { filter: drop-shadow(0 0 20px var(--marvel-gold)); }
            100% { filter: drop-shadow(0 0 15px var(--marvel-blue)); }
        }

        .zone-text {
            font-size: 2rem;
            color: var(--marvel-gold);
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            letter-spacing: 4px;
            margin-bottom: 20px;
        }

        #file-name {
            font-size: 1.5rem;
            color: var(--marvel-green);
            background: rgba(0, 255, 65, 0.1);
            padding: 15px 25px;
            border: 3px solid var(--marvel-green);
            border-radius: 0;
            box-shadow: var(--neon-glow) var(--marvel-green);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
            clip-path: polygon(10px 0%, 100% 0%, calc(100% - 10px) 100%, 0% 100%);
        }

        .player-container {
            margin: 40px 0;
            position: relative;
        }

        .video-wrapper {
            position: relative;
            background: linear-gradient(45deg, var(--marvel-red), var(--marvel-blue));
            padding: 8px;
            border-radius: 0;
            box-shadow: 
                0 0 40px rgba(255, 0, 0, 0.3),
                0 0 80px rgba(0, 102, 255, 0.2),
                inset 0 0 20px rgba(255, 255, 255, 0.1);
            transform: perspective(1000px) rotateY(-2deg) rotateX(2deg);
        }

        .video-wrapper::before {
            content: '';
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            background: linear-gradient(45deg, var(--marvel-gold), var(--marvel-purple), var(--marvel-green));
            z-index: -1;
            border-radius: 0;
            animation: borderPulse 4s ease-in-out infinite;
        }

        @keyframes borderPulse {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.02); }
        }

        video {
            width: 100%;
            height: auto;
            min-height: 400px;
            border-radius: 0;
            background: #000;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 30px 0;
        }

        .player-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .btn {
            background: linear-gradient(135deg, var(--darker-bg), var(--dark-bg));
            color: white;
            border: 3px solid;
            padding: 18px 25px;
            font-size: 1.1rem;
            font-weight: 700;
            font-family: 'Orbitron', monospace;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            overflow: hidden;
            clip-path: polygon(15px 0%, 100% 0%, calc(100% - 15px) 100%, 0% 100%);
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .download {
            border-color: var(--marvel-red);
            box-shadow: var(--neon-glow) var(--marvel-red);
        }

        .download:hover {
            background: var(--marvel-red);
            box-shadow: 0 0 30px var(--marvel-red);
            transform: translateY(-5px) scale(1.05);
        }

        .copy-link {
            border-color: var(--marvel-blue);
            box-shadow: var(--neon-glow) var(--marvel-blue);
        }

        .copy-link:hover {
            background: var(--marvel-blue);
            box-shadow: 0 0 30px var(--marvel-blue);
            transform: translateY(-5px) scale(1.05);
        }

        .player-btn {
            border-color: var(--marvel-gold);
            box-shadow: var(--neon-glow) var(--marvel-gold);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .player-btn:hover {
            background: var(--marvel-gold);
            color: var(--darker-bg);
            box-shadow: 0 0 30px var(--marvel-gold);
            transform: translateY(-5px) scale(1.05);
        }

        .player-logo {
            width: 30px;
            height: 30px;
            object-fit: contain;
            filter: brightness(1.2);
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 50px;
            padding: 30px;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid var(--marvel-purple);
            box-shadow: var(--neon-glow) var(--marvel-purple);
            clip-path: polygon(30px 0%, 100% 0%, calc(100% - 30px) 100%, 0% 100%);
        }

        .social-links a {
            display: block;
            transition: all 0.3s ease;
            filter: grayscale(0.5);
        }

        .social-links a:hover {
            transform: scale(1.3) rotate(10deg);
            filter: grayscale(0) brightness(1.3);
        }

        .social-links img {
            width: 50px;
            height: 50px;
            object-fit: contain;
        }

        .feedback {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(45deg, var(--marvel-green), var(--marvel-blue));
            color: white;
            padding: 20px 30px;
            border-radius: 0;
            font-weight: 700;
            font-size: 1.2rem;
            z-index: 1000;
            box-shadow: 0 0 50px rgba(0, 255, 65, 0.5);
            animation: feedbackPop 0.5s ease-out;
            clip-path: polygon(10px 0%, 100% 0%, calc(100% - 10px) 100%, 0% 100%);
        }

        @keyframes feedbackPop {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        .brutalist-border {
            position: relative;
        }

        .brutalist-border::after {
            content: '';
            position: absolute;
            top: 5px;
            left: 5px;
            right: -5px;
            bottom: -5px;
            border: 3px solid var(--marvel-red);
            z-index: -1;
            opacity: 0.7;
        }

        @media (max-width: 768px) {
            .marvel-logo {
                font-size: 2.5rem;
                letter-spacing: 4px;
            }
            
            .zone-text {
                font-size: 1.5rem;
                letter-spacing: 2px;
            }
            
            .controls {
                grid-template-columns: 1fr;
            }
            
            .player-grid {
                grid-template-columns: 1fr;
            }
            
            .social-links {
                gap: 20px;
            }
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 12px;
        }

        ::-webkit-scrollbar-track {
            background: var(--darker-bg);
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(45deg, var(--marvel-red), var(--marvel-blue));
            border-radius: 0;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(45deg, var(--marvel-gold), var(--marvel-purple));
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <div class="marvel-logo">MARVEL</div>
            <div class="zone-text">ZONE</div>
            <h1 id="file-name" class="brutalist-border">Epic Video Experience</h1>
        </header>
        
        <div class="player-container">
            <div class="video-wrapper">
                <video class="plyr" controls poster="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/well.png" alt="Video Player Poster Image">
                    <source src="#" type="video/mp4" alt="Video Source">
                    Your browser does not support the video tag.
                </video>
            </div>
        </div>

        <div class="controls">
            <button class="btn download" onclick="download()">
                <i class="fas fa-cloud-download-alt"></i> DOWNLOAD NOW
            </button>
            <button class="btn copy-link" onclick="copyLink()">
                <i class="fas fa-link"></i> COPY LINK
            </button>
        </div>
        
        <div class="player-grid">
            <button class="btn player-btn" onclick="playOnline('vlc')">
                <img src="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/vlc.png" alt="VLC Mobile" class="player-logo"> 
                VLC MOBILE
            </button>
            <button class="btn player-btn" onclick="playOnline('mx')">
                <img src="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/mx.png" alt="MX Player" class="player-logo"> 
                MX PLAYER
            </button>
            <button class="btn player-btn" onclick="playOnline('np')">
                <img src="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/nPlayer.webp" alt="nPlayer" class="player-logo"> 
                N PLAYER
            </button>
            <button class="btn player-btn" onclick="playOnline('sp')">
                <img src="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/splayer.webp" alt="S Player" class="player-logo"> 
                S PLAYER
            </button>
            <button class="btn player-btn" onclick="playOnline('km')">
                <img src="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/km.webp" alt="KM Player" class="player-logo"> 
                KM PLAYER
            </button>
        </div>

        <div class="social-links">
            <a href="http://youtube.com/@avbotx"> 
                <img src="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/youtube.png" alt="YouTube">
            </a>
            <a href="http://GitHub.com/Botsthe"> 
                <img src="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/github.png" alt="GitHub">
            </a>
            <a href="http://t.me/BOT_OWNER26"> 
                <img src="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/telegram.png" alt="Telegram">
            </a>
            <a href="https://www.instagram.com/aman_developerr"> 
                <img src="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/instagram.png" alt="Instagram">
            </a>
        </div>
    </div>

    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const videoElement = document.querySelector('.plyr');
            new Plyr(videoElement, {
                controls: ['play-large', 'restart', 'rewind', 'play', 'fast-forward', 'progress', 'current-time', 'duration', 'mute', 'volume', 'settings', 'fullscreen'],
                settings: ['quality', 'speed'],
                speed: { selected: 1, options: [0.5, 0.75, 1, 1.25, 1.5, 1.75, 2] },
                quality: { default: 720, options: [4320, 2880, 2160, 1440, 1080, 720, 576, 480, 360, 240] }
            });
        });

        const currentUrl = window.location.href;
        const finalUrl = currentUrl.replace("/watch/", "/dl/");
        
        function playOnline(player) {
            const playerUrls = {
                vlc: `vlc://${finalUrl}`,
                mxp: `intent:${finalUrl}#Intent;package=com.mxtech.videoplayer.pro;end`,
                mx: `intent:${finalUrl}#Intent;package=com.mxtech.videoplayer.ad;end`,
                np: `nplayer-${finalUrl}`,
                sp: `intent:${finalUrl}#Intent;action=com.young.simple.player.playback_online;package=com.young.simple.player;end`,
                km: `intent:${finalUrl}#Intent;package=com.kmplayer;end`
            };
            window.location.href = playerUrls[player] || finalUrl;
        }

        function download() {
            window.location.href = finalUrl;
        }

        function copyLink() {
            navigator.clipboard.writeText(finalUrl)
                .then(() => {
                    const feedback = document.createElement('div');
                    feedback.className = 'feedback';
                    feedback.innerHTML = "🚀 LINK COPIED TO CLIPBOARD! 🚀";
                    feedback.setAttribute("role", "alert");
                    document.body.appendChild(feedback);
                    setTimeout(() => feedback.remove(), 3000);
                })
                .catch(err => console.error('Could not copy text: ', err));
        }

        // Add some interactive particles effect
        function createParticle() {
            const particle = document.createElement('div');
            particle.style.position = 'fixed';
            particle.style.width = '4px';
            particle.style.height = '4px';
            particle.style.background = `rgb(${Math.random() * 255}, ${Math.random() * 255}, ${Math.random() * 255})`;
            particle.style.left = Math.random() * window.innerWidth + 'px';
            particle.style.top = Math.random() * window.innerHeight + 'px';
            particle.style.pointerEvents = 'none';
            particle.style.zIndex = '-1';
            particle.style.borderRadius = '50%';
            particle.style.animation = `float ${Math.random() * 3 + 2}s linear infinite`;
            
            document.body.appendChild(particle);
            
            setTimeout(() => {
                particle.remove();
            }, 5000);
        }

        // Create floating particles
        setInterval(createParticle, 300);

        // Add CSS animation for particles
        const style = document.createElement('style');
        style.textContent = `
            @keyframes float {
                0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
                100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
