<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta property="og:image" content="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/live.png">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MARVAL ZO | {{file_name}}</title>
<link rel="icon" href="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/logo.png" type="image/x-icon">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/plyr/3.7.8/plyr.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #FF3366;
  --secondary: #33CCFF;
  --accent1: #FFCC00;
  --accent2: #66FF99;
  --dark: #111111;
  --light: #F5F5F5;
  --shadow-offset: 4px;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Space Grotesk', sans-serif;
  background-color: #f0f0f0;
  background-image:
    radial-gradient(var(--accent1) 2px, transparent 2px),
    radial-gradient(var(--secondary) 2px, transparent 2px);
  background-size: 30px 30px;
  background-position: 0 0, 15px 15px;
  color: var(--dark);
  padding: 20px 10px;
}

.container {
  max-width: 1000px;
  margin: 0 auto;
  padding: 15px;
}

header {
  margin-bottom: 20px;
  position: relative;
}

h1 {
  font-family: 'Unbounded', cursive;
  font-size: 2rem;
  font-weight: 900;
  text-transform: uppercase;
  color: var(--dark);
  background-color: var(--accent1);
  padding: 12px 20px;
  border: 3px solid var(--dark);
  box-shadow: var(--shadow-offset) var(--shadow-offset) 0 var(--dark);
  display: inline-block;
  transform: rotate(-1deg);
  margin-bottom: 20px;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.player-container {
  margin-bottom: 25px;
  border: 5px solid var(--dark);
  box-shadow: var(--shadow-offset) var(--shadow-offset) 0 var(--dark);
  background-color: var(--secondary);
  padding: 10px;
  position: relative;
  overflow: hidden;
}

.video-wrapper {
  position: relative;
  width: 100%;
  background-color: #000;
  border: 3px solid var(--dark);
}

video {
  width: 100%;
  display: block;
}

/* Custom player styling */
.plyr--video {
  border-radius: 0;
}

.plyr__control--overlaid {
  background: var(--primary);
  border: 2px solid var(--dark);
  box-shadow: 3px 3px 0 var(--dark);
}

.plyr__control--overlaid:hover {
  background: var(--accent1);
  transform: scale(1.1);
}

.plyr--full-ui input[type=range] {
  color: var(--primary);
}

.plyr__control.plyr__tab-focus,
.plyr__control:hover,
.plyr__control[aria-expanded=true] {
  background: var(--accent1);
}

.controls {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
  margin-bottom: 20px;
}

.btn {
  font-family: 'Unbounded', cursive;
  font-weight: 700;
  font-size: 1rem;
  padding: 15px 20px;
  border: 3px solid var(--dark);
  box-shadow: var(--shadow-offset) var(--shadow-offset) 0 var(--dark);
  background-color: white;
  cursor: pointer;
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  text-transform: uppercase;
}

.btn:active {
  box-shadow: 1px 1px 0 var(--dark);
  transform: translate(3px, 3px);
}

.download {
  background-color: var(--accent2);
}

.copy-link {
  background-color: var(--secondary);
}

.player-options {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.player-btn {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700;
  font-size: 0.9rem;
  padding: 12px 15px;
  border: 3px solid var(--dark);
  box-shadow: var(--shadow-offset) var(--shadow-offset) 0 var(--dark);
  cursor: pointer;
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background-color: white;
}

.player-btn:nth-child(1) {
  background-color: #fb7e01;
}

.player-btn:nth-child(2) {
  background-color: #7EB5FF;
}

.player-btn:nth-child(3) {
  background-color: #ffcc66;
}

.player-btn:nth-child(4) {
  background-color: #ff99cc;
}

.player-btn:nth-child(5) {
  background-color: #66ccff;
}

.player-btn:active {
  box-shadow: 1px 1px 0 var(--dark);
  transform: translate(3px, 3px);
}

.player-logo {
  width: 24px;
  height: 24px;
  object-fit: contain;
  border-radius: 0;
}

.social-links {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-top: 20px;
  padding: 20px;
  background-color: var(--primary);
  border: 3px solid var(--dark);
  box-shadow: var(--shadow-offset) var(--shadow-offset) 0 var(--dark);
}

.social-links a {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 50px;
  height: 50px;
  background-color: white;
  border: 3px solid var(--dark);
  border-radius: 10px;
  box-shadow: 3px 3px 0 var(--dark);
  transition: all 0.2s ease;
}

.social-links a:hover {
  transform: translateY(-5px);
}

.social-links a:active {
  box-shadow: 1px 1px 0 var(--dark);
  transform: translate(2px, 2px);
}

.social-links img {
  width: 30px;
  height: 30px;
  object-fit: contain;
}

.feedback {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background-color: var(--accent1);
  color: var(--dark);
  padding: 15px 25px;
  border: 3px solid var(--dark);
  box-shadow: var(--shadow-offset) var(--shadow-offset) 0 var(--dark);
  font-family: 'Unbounded', cursive;
  font-weight: 700;
  border-radius: 0;
  z-index: 1000;
  animation: popIn 0.3s ease-out;
}

/* Dynamic control buttons */
.player-controls-container {
  background-color: white;
  border: 3px solid var(--dark);
  box-shadow: var(--shadow-offset) var(--shadow-offset) 0 var(--dark);
  padding: 15px;
  margin-bottom: 20px;
}

.control-section {
  margin-bottom: 15px;
}

.control-section:last-child {
  margin-bottom: 0;
}

.control-label {
  font-family: 'Unbounded', cursive;
  font-weight: 700;
  margin-bottom: 8px;
  display: block;
  color: var(--dark);
}

.control-options {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.control-btn {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700;
  padding: 8px 15px;
  border: 2px solid var(--dark);
  box-shadow: 3px 3px 0 var(--dark);
  cursor: pointer;
  transition: all 0.2s ease;
  background-color: white;
}

.control-btn.active {
  background-color: var(--accent1);
  transform: translate(1px, 1px);
  box-shadow: 2px 2px 0 var(--dark);
}

.control-btn:hover {
  background-color: var(--accent2);
}

.player-loading {
  text-align: center;
  padding: 15px;
  font-weight: bold;
}

@keyframes popIn {
  0% { transform: translateX(-50%) scale(0.8); opacity: 0; }
  70% { transform: translateX(-50%) scale(1.1); }
  100% { transform: translateX(-50%) scale(1); opacity: 1; }
}

@media (max-width: 768px) {
  h1 {
    font-size: 1.5rem;
    padding: 10px 15px;
  }

  .controls {
    grid-template-columns: 1fr;
  }

  .player-options {
    grid-template-columns: 1fr 1fr;
  }

  .social-links {
    flex-wrap: wrap;
  }
}

.copyright {
  text-align: center;
  margin-top: 20px;
  font-size: 0.8rem;
  font-weight: 500;
  color: var(--dark);
  opacity: 0.7;
}

/* Spinner for loading states */
.spinner {
  display: inline-block;
  width: 40px;
  height: 40px;
  border: 4px solid rgba(255, 255, 255, 0.3);
  border-radius: 50%;
  border-top-color: var(--primary);
  animation: spin 1s ease-in-out infinite;
  margin-right: 10px;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* HLS.js specific styling */
.fullscreen-enabled {
  background: black;
}
</style>
</head>
<body>

<!-- Include HLS.js for adaptive streaming support -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.4.0/hls.min.js"></script>
<!-- Include Plyr.js for a nicer player UI -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/plyr/3.7.8/plyr.min.js"></script>
<!-- Include Shaka Player for more advanced streaming -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.6/shaka-player.compiled.js"></script>

<script>
document.addEventListener('DOMContentLoaded', () => {
  // Initialize variables
  let player;
  let shakaPlayer;
  let hls;
  let videoElement = document.getElementById('player');
  let videoSource = document.getElementById('video-source');
  let videoUrl = videoSource.src;
  let currentQuality = '';
  let currentAudioTrack = '';
  let currentSubtitle = '';
  
  // Initialize player with appropriate tech based on source
  initializePlayer();
  
  function initializePlayer() {
    // Check if it's potentially an HLS stream (m3u8)
    if (videoUrl.includes('.m3u8')) {
      initializeHLSPlayer();
    } 
    // Check if it's potentially a DASH stream (mpd)
    else if (videoUrl.includes('.mpd')) {
      initializeShakaPlayer();
    } 
    // Otherwise, use standard player for MP4
    else {
      initializeStandardPlayer();
    }
  }
  
  function initializeStandardPlayer() {
    // Create array of video qualities for demonstration
    // In a real implementation, you would detect these from the server
    const qualities = [
      { name: '1080p', url: videoUrl.replace('.mp4', '_1080p.mp4'), selected: false },
      { name: '720p', url: videoUrl, selected: true },
      { name: '480p', url: videoUrl.replace('.mp4', '_480p.mp4'), selected: false },
      { name: '360p', url: videoUrl.replace('.mp4', '_360p.mp4'), selected: false }
    ];
    
    // Create array of audio tracks for demonstration
    // In a real implementation, you would detect these from the video
    const audioTracks = [
      { name: 'English', language: 'en', selected: true },
      { name: 'Hindi', language: 'hi', selected: false },
      { name: 'Original', language: 'original', selected: false }
    ];
    
    // Create array of subtitles for demonstration
    const subtitles = [
      { name: 'Off', language: 'off', selected: true },
      { name: 'English', language: 'en', selected: false },
      { name: 'Hindi', language: 'hi', selected: false }
    ];
    
    // Initialize standard player
    player = new Plyr(videoElement, {
      controls: [
        'play-large', 'play', 'progress', 'current-time', 'duration',
        'mute', 'volume', 'settings', 'pip', 'airplay', 'fullscreen'
      ],
      fullscreen: { enabled: true, fallback: true, iosNative: true }
    });
    
    // Populate quality options
    populateQualityOptions(qualities);
    
    // Populate audio options
    populateAudioOptions(audioTracks);
    
    // Populate subtitle options
    populateSubtitleOptions(subtitles);
    
    // Listen for play event to check audio/subtitle tracks
    player.on('ready', () => {
      // Attempt to detect actual audio tracks if available
      detectAudioTracks();
      
      // Fix for fullscreen
      player.elements.container.addEventListener('fullscreenchange', adjustFullscreen);
    });
  }
  
  function initializeHLSPlayer() {
    // Check if HLS.js is supported
    if (Hls.isSupported()) {
      // Initialize HLS
      hls = new Hls({
        maxBufferLength: 30,
        maxMaxBufferLength: 60,
        manifestLoadingTimeOut: 10000
      });
      
      // Bind HLS to video element
      hls.attachMedia(videoElement);
      
      // Load source
      hls.loadSource(videoUrl);
      
      // Initialize player once HLS is ready
      hls.on(Hls.Events.MANIFEST_PARSED, function(event, data) {
        // Initialize Plyr
        player = new Plyr(videoElement, {
          controls: [
            'play-large', 'play', 'progress', 'current-time', 'duration',
            'mute', 'volume', 'settings', 'pip', 'airplay', 'fullscreen'
          ],
          fullscreen: { enabled: true, fallback: true, iosNative: true }
        });
        
        // Get available quality levels
        const qualities = data.levels.map((level, index) => {
          return {
            name: `${level.height}p`,
            url: index,
            selected: index === hls.currentLevel
          };
        });
        
        // Populate quality options
        populateQualityOptions(qualities);
        
        // Listen for quality changes
        player.on('qualitychange', () => {
          // Update quality buttons when changed through player UI
          const qualityButtons = document.querySelectorAll('#quality-options .control-btn');
          qualityButtons.forEach(btn => {
            if (parseInt(btn.dataset.value) === hls.currentLevel) {
              btn.classList.add('active');
            } else {
              btn.classList.remove('active');
            }
          });
        });
        
        // Detect audio tracks
        if (hls.audioTracks && hls.audioTracks.length > 0) {
          const audioTracks = hls.audioTracks.map((track, index) => {
            return {
              name: track.name || `Audio ${index + 1}`,
              language: track.lang || `Track ${index + 1}`,
              selected: index === hls.audioTrack
            };
          });
          
          // Populate audio options
          populateAudioOptions(audioTracks);
        } else {
          // Fallback for audio tracks
          const audioFallback = [
            { name: 'Default', language: 'default', selected: true }
          ];
          populateAudioOptions(audioFallback);
        }
        
        // Detect subtitles
        if (hls.subtitleTracks && hls.subtitleTracks.length > 0) {
          const subtitles = [
            { name: 'Off', language: 'off', selected: true },
            ...hls.subtitleTracks.map((track, index) => {
              return {
                name: track.name || `Subtitle ${index + 1}`,
                language: track.lang || `sub${index + 1}`,
                selected: false
              };
            })
          ];
          
          // Populate subtitle options
          populateSubtitleOptions(subtitles);
        } else {
          // Fallback for subtitles
          const subtitleFallback = [
            { name: 'None Available', language: 'none', selected: true }
          ];
          populateSubtitleOptions(subtitleFallback);
        }
      });
      
      // Error handling
      hls.on(Hls.Events.ERROR, function(event, data) {
        console.error('HLS error:', data);
        if (data.fatal) {
          switch (data.type) {
            case Hls.ErrorTypes.NETWORK_ERROR:
              showFeedback('Network error, trying to recover...');
              hls.startLoad();
              break;
            case Hls.ErrorTypes.MEDIA_ERROR:
              showFeedback('Media error, trying to recover...');
              hls.recoverMediaError();
              break;
            default:
              // Fatal error, try to use standard player
              showFeedback('Stream error, falling back to standard player');
              hls.destroy();
              initializeStandardPlayer();
              break;
          }
        }
      });
    } else if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
      // For Safari which has native HLS support
      videoElement.src = videoUrl;
      
      // Initialize standard player
      initializeStandardPlayer();
    } else {
      // Fallback to standard player for browsers that don't support HLS
      showFeedback('Your browser does not support HLS streams');
      initializeStandardPlayer();
    }
  }
  
  function initializeShakaPlayer() {
    // Check if Shaka Player is supported
    if (shaka.Player.isBrowserSupported()) {
      // Initialize Shaka Player
      shakaPlayer = new shaka.Player(videoElement);
      
      // Attach player to UI
      player = new Plyr(videoElement, {
        controls: [
          'play-large', 'play', 'progress', 'current-time', 'duration',
          'mute', 'volume', 'settings', 'pip', 'airplay', 'fullscreen'
        ],
        fullscreen: { enabled: true, fallback: true, iosNative: true }
      });
      
      // Load DASH manifest
      shakaPlayer.load(videoUrl).then(() => {
        // Get available tracks
        const tracks = shakaPlayer.getVariantTracks();
        
        // Extract quality options
        const qualities = tracks
          .filter(track => track.type === 'variant')
          .map(track => {
            return {
              name: track.height ? `${track.height}p` : 'Auto',
              url: track.id,
              selected: track.active
            };
          });
        
        // Extract audio tracks
        const audioTracks = tracks
          .filter(track => track.audioCodec)
          .map(track => {
            return {
              name: track.language || 'Unknown',
              language: track.language || 'unknown',
              selected: track.active
            };
          });
        
        // Extract text tracks (subtitles)
        const textTracks = shakaPlayer.getTextTracks();
        const subtitles = [
          { name: 'Off', language: 'off', selected: true },
          ...textTracks.map(track => {
            return {
              name: track.language || 'Unknown',
              language: track.language || 'unknown',
              selected: false
            };
          })
        ];
        
        // Populate UI
        populateQualityOptions(qualities);
        populateAudioOptions(audioTracks.length > 0 ? audioTracks : [{ name: 'Default', language: 'default', selected: true }]);
        populateSubtitleOptions(subtitles);
      }).catch(error => {
        console.error('Error loading DASH content:', error);
        showFeedback('Error loading stream, falling back to standard player');
        initializeStandardPlayer();
      });
    } else {
      // Fallback to standard player
      showFeedback('Your browser does not support DASH streams');
      initializeStandardPlayer();
    }
  }
  
  function populateQualityOptions(qualities) {
    const qualityOptions = document.getElementById('quality-options');
    qualityOptions.innerHTML = '';
    
    if (qualities.length === 0) {
      qualityOptions.innerHTML = '<div>No quality options available</div>';
      return;
    }
    
    // First add an "Auto" option if not already included
    if (!qualities.some(q => q.name === 'Auto')) {
      const autoBtn = document.createElement('button');
      autoBtn.className = 'control-btn active';
      autoBtn.textContent = 'Auto';
      autoBtn.dataset.value = 'auto';
      autoBtn.addEventListener('click', () => switchQuality('auto'));
      qualityOptions.appendChild(autoBtn);
    }
    
    // Add quality options
    qualities.forEach(quality => {
      const btn = document.createElement('button');
      btn.className = 'control-btn';
      if (quality.selected) btn.classList.add('active');
      btn.textContent = quality.name;
      btn.dataset.value = quality.url;
      
      btn.addEventListener('click', function() {
        // Remove active class from all buttons
        document.querySelectorAll('#quality-options .control-btn').forEach(el => {
          el.classList.remove('active');
        });
        
        // Add active class to clicked button
        this.classList.add('active');
        
        // Switch quality
        switchQuality(quality.url);
      });
      
      qualityOptions.appendChild(btn);
    });
  }
  
  function populateAudioOptions(audioTracks) {
    const audioOptions = document.getElementById('audio-options');
    audioOptions.innerHTML = '';
    
    if (audioTracks.length === 0) {
      audioOptions.innerHTML = '<div>No audio options available</div>';
      return;
    }
    
    // Add audio track options
    audioTracks.forEach(track => {
      const btn = document.createElement('button');
      btn.className = 'control-btn';
