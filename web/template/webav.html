<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta property="og:image" content="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/live.png">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MARVAL ZO | {{file_name}}</title>
<link rel="icon" href="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/logo.png" type="image/x-icon">
<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #FF3366;
  --secondary: #33CCFF;
  --accent1: #FFCC00;
  --accent2: #66FF99;
  --dark: #111111;
  --light: #F5F5F5;
  --shadow-offset: 4px;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Space Grotesk', sans-serif;
  background-color: #f0f0f0;
  background-image:
    radial-gradient(var(--accent1) 2px, transparent 2px),
    radial-gradient(var(--secondary) 2px, transparent 2px);
  background-size: 30px 30px;
  background-position: 0 0, 15px 15px;
  color: var(--dark);
  padding: 20px 10px;
}

.container {
  max-width: 1000px;
  margin: 0 auto;
  padding: 15px;
}

header {
  margin-bottom: 20px;
  position: relative;
}

h1 {
  font-family: 'Unbounded', cursive;
  font-size: 2rem;
  font-weight: 900;
  text-transform: uppercase;
  color: var(--dark);
  background-color: var(--accent1);
  padding: 12px 20px;
  border: 3px solid var(--dark);
  box-shadow: var(--shadow-offset) var(--shadow-offset) 0 var(--dark);
  display: inline-block;
  transform: rotate(-1deg);
  margin-bottom: 20px;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.player-container {
  margin-bottom: 25px;
  border: 5px solid var(--dark);
  box-shadow: var(--shadow-offset) var(--shadow-offset) 0 var(--dark);
  background-color: var(--secondary);
  padding: 10px;
  position: relative;
  overflow: hidden;
}

.video-wrapper {
  position: relative;
  width: 100%;
  background-color: #000;
  border: 3px solid var(--dark);
}

.plyr {
  width: 100%;
  max-height: 75vh;
}

/* Custom player styling */
.plyr--video {
  border-radius: 0;
}

.plyr__control--overlaid {
  background: var(--primary);
  border: 2px solid var(--dark);
  box-shadow: 3px 3px 0 var(--dark);
}

.plyr__control--overlaid:hover {
  background: var(--accent1);
  transform: scale(1.1);
}

.plyr--full-ui input[type=range] {
  color: var(--primary);
}

.plyr__control.plyr__tab-focus,
.plyr__control:hover,
.plyr__control[aria-expanded=true] {
  background: var(--accent1);
}

.controls {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
  margin-bottom: 20px;
}

.btn {
  font-family: 'Unbounded', cursive;
  font-weight: 700;
  font-size: 1rem;
  padding: 15px 20px;
  border: 3px solid var(--dark);
  box-shadow: var(--shadow-offset) var(--shadow-offset) 0 var(--dark);
  background-color: white;
  cursor: pointer;
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  text-transform: uppercase;
}

.btn:active {
  box-shadow: 1px 1px 0 var(--dark);
  transform: translate(3px, 3px);
}

.download {
  background-color: var(--accent2);
}

.copy-link {
  background-color: var(--secondary);
}

.player-options {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.player-btn {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700;
  font-size: 0.9rem;
  padding: 12px 15px;
  border: 3px solid var(--dark);
  box-shadow: var(--shadow-offset) var(--shadow-offset) 0 var(--dark);
  cursor: pointer;
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background-color: white;
}

.player-btn:nth-child(1) {
  background-color: #fb7e01;
}

.player-btn:nth-child(2) {
  background-color: #7EB5FF;
}

.player-btn:nth-child(3) {
  background-color: #ffcc66;
}

.player-btn:nth-child(4) {
  background-color: #ff99cc;
}

.player-btn:nth-child(5) {
  background-color: #66ccff;
}

.player-btn:active {
  box-shadow: 1px 1px 0 var(--dark);
  transform: translate(3px, 3px);
}

.player-logo {
  width: 24px;
  height: 24px;
  object-fit: contain;
  border-radius: 0;
}

.social-links {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-top: 20px;
  padding: 20px;
  background-color: var(--primary);
  border: 3px solid var(--dark);
  box-shadow: var(--shadow-offset) var(--shadow-offset) 0 var(--dark);
}

.social-links a {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 50px;
  height: 50px;
  background-color: white;
  border: 3px solid var(--dark);
  border-radius: 10px;
  box-shadow: 3px 3px 0 var(--dark);
  transition: all 0.2s ease;
}

.social-links a:hover {
  transform: translateY(-5px);
}

.social-links a:active {
  box-shadow: 1px 1px 0 var(--dark);
  transform: translate(2px, 2px);
}

.social-links img {
  width: 30px;
  height: 30px;
  object-fit: contain;
}

.feedback {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background-color: var(--accent1);
  color: var(--dark);
  padding: 15px 25px;
  border: 3px solid var(--dark);
  box-shadow: var(--shadow-offset) var(--shadow-offset) 0 var(--dark);
  font-family: 'Unbounded', cursive;
  font-weight: 700;
  border-radius: 0;
  z-index: 1000;
  animation: popIn 0.3s ease-out;
}

.player-message {
  background-color: rgba(0, 0, 0, 0.7);
  color: white;
  padding: 15px;
  text-align: center;
  font-weight: bold;
  position: absolute;
  bottom: 10px;
  left: 10px;
  right: 10px;
  z-index: 100;
  display: none;
  border-radius: 5px;
}

.quality-selector {
  margin-bottom: 15px;
  display: flex;
  justify-content: center;
}

.quality-btn {
  margin: 0 5px;
  padding: 8px 15px;
  background-color: white;
  border: 2px solid var(--dark);
  cursor: pointer;
  font-weight: bold;
}

.quality-btn.active {
  background-color: var(--accent1);
}

.low-quality-notice {
  background-color: rgba(255, 204, 0, 0.9);
  color: black;
  padding: 10px;
  text-align: center;
  margin-bottom: 10px;
  font-weight: bold;
  display: none;
  border: 2px solid var(--dark);
}

@keyframes popIn {
  0% { transform: translateX(-50%) scale(0.8); opacity: 0; }
  70% { transform: translateX(-50%) scale(1.1); }
  100% { transform: translateX(-50%) scale(1); opacity: 1; }
}

@media (max-width: 768px) {
  h1 {
    font-size: 1.5rem;
    padding: 10px 15px;
  }
  
  .controls {
    grid-template-columns: 1fr;
  }
  
  .player-options {
    grid-template-columns: 1fr 1fr;
  }
  
  .social-links {
    flex-wrap: wrap;
  }
}

.copyright {
  text-align: center;
  margin-top: 20px;
  font-size: 0.8rem;
  font-weight: 500;
  color: var(--dark);
  opacity: 0.7;
}

/* Loading spinner */
.loading-spinner {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 50px;
  height: 50px;
  border: 5px solid rgba(255, 255, 255, 0.3);
  border-radius: 50%;
  border-top-color: var(--primary);
  animation: spin 1s ease-in-out infinite;
  z-index: 10;
  display: none;
}

@keyframes spin {
  to { transform: translate(-50%, -50%) rotate(360deg); }
}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1 id="file-name">{{file_name}}</h1>
  </header>

  <div class="player-container">
    <div class="low-quality-notice" id="quality-notice">
      Playing in low quality mode for better performance. Use external player for best quality.
    </div>
    
    <div class="quality-selector">
      <button class="quality-btn active" id="low-quality">Low Quality (Browser Friendly)</button>
      <button class="quality-btn" id="high-quality">High Quality (May Buffer)</button>
    </div>
    
    <div class="video-wrapper">
      <div class="loading-spinner" id="loading-spinner"></div>
      <div class="player-message" id="player-message"></div>
      <video class="plyr" controls poster="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/well.png" id="video-player">
        <source src="{{file_url}}" type="video/mp4" id="video-source">
        Your browser does not support the video tag.
      </video>
    </div>
  </div>

  <div class="controls">
    <button class="btn download" onclick="download()">
      <i class="fas fa-cloud-download-alt"></i> Download Now
    </button>
    <button class="btn copy-link" onclick="copyLink()">
      <i class="fas fa-link"></i> Copy Direct Link
    </button>
  </div>

  <div class="player-options">
    <button class="player-btn" onclick="playOnline('vlc')">
      <img src="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/vlc.png" alt="VLC Mobile" class="player-logo">
      VLC Mobile
    </button>
    <button class="player-btn" onclick="playOnline('mx')">
      <img src="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/mx.png" alt="MX Player" class="player-logo">
      MX Player
    </button>
    <button class="player-btn" onclick="playOnline('np')">
      <img src="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/nPlayer.webp" alt="nPlayer" class="player-logo">
      nPlayer
    </button>
    <button class="player-btn" onclick="playOnline('sp')">
      <img src="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/splayer.webp" alt="S Player" class="player-logo">
      S Player
    </button>
    <button class="player-btn" onclick="playOnline('km')">
      <img src="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/km.webp" alt="KM Player" class="player-logo">
      KM Player
    </button>
  </div>

  <div class="social-links">
    <a href="http://youtube.com/@avbotx" aria-label="YouTube">
      <img src="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/youtube.png" alt="YouTube">
    </a>
    <a href="http://GitHub.com/Botsthe" aria-label="GitHub">
      <img src="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/github.png" alt="GitHub">
    </a>
    <a href="http://t.me/BOT_OWNER26" aria-label="Telegram">
      <img src="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/telegram.png" alt="Telegram">
    </a>
    <a href="https://www.instagram.com/aman_developerr" aria-label="Instagram">
      <img src="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/instagram.png" alt="Instagram">
    </a>
  </div>

  <div class="copyright">
    © marvalzi | @Marvalzod | @drdoom
  </div>
</div>

<script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  // Get elements
  const videoElement = document.querySelector('.plyr');
  const videoSource = document.getElementById('video-source');
  const playerMessage = document.getElementById('player-message');
  const loadingSpinner = document.getElementById('loading-spinner');
  const lowQualityBtn = document.getElementById('low-quality');
  const highQualityBtn = document.getElementById('high-quality');
  const qualityNotice = document.getElementById('quality-notice');
  
  // Original video URL
  const originalUrl = videoSource.src;
  
  // Create low quality URL (using query parameter technique)
  let lowQualityUrl = originalUrl;
  if (originalUrl.includes('?')) {
    lowQualityUrl = originalUrl + '&quality=low';
  } else {
    lowQualityUrl = originalUrl + '?quality=low';
  }
  
  // By default, start with low quality for better compatibility
  videoSource.src = lowQualityUrl;
  qualityNotice.style.display = 'block';
  
  // Initialize Plyr with more browser-friendly settings
  const player = new Plyr(videoElement, {
    controls: [
      'play-large', 'play', 'progress', 'current-time', 'mute',
      'volume', 'captions', 'settings', 'pip', 'fullscreen'
    ],
    settings: ['quality', 'speed'],
    disableContextMenu: false,
    quality: {
      default: 576,
      options: [4320, 2880, 2160, 1440, 1080, 720, 576, 480, 360, 240]
    }
  });
  
  // Quality selector functionality
  lowQualityBtn.addEventListener('click', () => {
    loadingSpinner.style.display = 'block';
    lowQualityBtn.classList.add('active');
    highQualityBtn.classList.remove('active');
    qualityNotice.style.display = 'block';
    
    const currentTime = videoElement.currentTime;
    videoSource.src = lowQualityUrl;
    videoElement.load();
    
    videoElement.addEventListener('loadeddata', function onLoad() {
      videoElement.currentTime = currentTime;
      videoElement.play().catch(e => console.error('Playback failed:', e));
      loadingSpinner.style.display = 'none';
      videoElement.removeEventListener('loadeddata', onLoad);
    }, { once: true });
  });
  
  highQualityBtn.addEventListener('click', () => {
    loadingSpinner.style.display = 'block';
    highQualityBtn.classList.add('active');
    lowQualityBtn.classList.remove('active');
    qualityNotice.style.display = 'none';
    
    const currentTime = videoElement.currentTime;
    videoSource.src = originalUrl;
    videoElement.load();
    
    videoElement.addEventListener('loadeddata', function onLoad() {
      videoElement.currentTime = currentTime;
      videoElement.play().catch(e => console.error('Playback failed:', e));
      loadingSpinner.style.display = 'none';
      videoElement.removeEventListener('loadeddata', onLoad);
    }, { once: true });
  });
  
  // Error handling
  videoElement.addEventListener('error', (e) => {
    console.error('Video error:', e);
    if (videoSource.src === originalUrl) {
      playerMessage.textContent = 'Error playing high quality video. Switching to low quality...';
      playerMessage.style.display = 'block';
      
      setTimeout(() => {
        lowQualityBtn.click();
        setTimeout(() => {
          playerMessage.style.display = 'none';
        }, 3000);
      }, 2000);
    } else {
      playerMessage.textContent = 'Video playback error. Try using an external player for better results.';
      playerMessage.style.display = 'block';
      
      setTimeout(() => {
        playerMessage.style.display = 'none';
      }, 5000);
    }
  });
  
  // Handle large file optimization
  videoElement.addEventListener('waiting', () => {
    loadingSpinner.style.display = 'block';
  });
  
  videoElement.addEventListener('playing', () => {
    loadingSpinner.style.display = 'none';
  });
  
  // Check for video stalls
  let lastTime = 0;
  let stallCount = 0;
  const stallCheckInterval = setInterval(() => {
    if (videoElement.paused) return;
    
    if (videoElement.currentTime === lastTime) {
      stallCount++;
      if (stallCount > 3 && videoSource.src === originalUrl) {
        playerMessage.textContent = 'Video playback stalled. Switching to low quality...';
        playerMessage.style.display = 'block';
        
        setTimeout(() => {
          lowQualityBtn.click();
          stallCount = 0;
          setTimeout(() => {
            playerMessage.style.display = 'none';
          }, 3000);
        }, 2000);
      }
    } else {
      stallCount = 0;
    }
    
    lastTime = videoElement.currentTime;
  }, 1000);
  
  // Memory management - clean up when leaving page
  window.addEventListener('beforeunload', () => {
    clearInterval(stallCheckInterval);
    player.destroy();
  });
});

const currentUrl = window.location.href;
const finalUrl = currentUrl.replace("/watch/", "/dl/");

function playOnline(player) {
  const playerUrls = {
    vlc: `vlc://${finalUrl}`,
    mxp: `intent:${finalUrl}#Intent;package=com.mxtech.videoplayer.pro;end`,
    mx: `intent:${finalUrl}#Intent;package=com.mxtech.videoplayer.ad;end`,
    np: `nplayer-${finalUrl}`,
    sp: `intent:${finalUrl}#Intent;action=com.young.simple.player.playback_online;package=com.young.simple.player;end`,
    km: `intent:${finalUrl}#Intent;package=com.kmplayer;end`
  };
  window.location.href = playerUrls[player] || finalUrl;
}

function download() {
  window.location.href = finalUrl;
}

function copyLink() {
  navigator.clipboard.writeText(finalUrl)
    .then(() => {
      const feedback = document.createElement('div');
      feedback.className = 'feedback';
      feedback.textContent = "📋 Link copied to clipboard!";
      feedback.setAttribute("role", "alert");
      document.body.appendChild(feedback);
      setTimeout(() => feedback.remove(), 3000);
    })
    .catch(err => console.error('Could not copy text: ', err));
}

// Update file name when loaded
window.addEventListener('DOMContentLoaded', () => {
  const fileNameElement = document.getElementById('file-name');
  const pathParts = window.location.pathname.split('/');
  const fileName = pathParts[pathParts.length - 1].replace(/_/g, ' ');
  
  if (fileName) {
    fileNameElement.textContent = decodeURIComponent(fileName);
    document.title = `MARVAL ZO | ${decodeURIComponent(fileName)}`;
  }
});
</script>
</body>
</html>
