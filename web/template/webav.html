<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta property="og:image" content="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/live.png">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AV BOTz | Video Player</title>
    <link rel="icon" href="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/logo.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'JetBrains Mono', monospace;
            background: #000;
            color: #fff;
            line-height: 1.2;
            overflow-x: hidden;
        }

        .container {
            max-width: 100vw;
            margin: 0;
            padding: 0;
        }

        header {
            background: #fff;
            color: #000;
            padding: 20px;
            border-bottom: 8px solid #ff0000;
            position: relative;
        }

        header::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 0;
            width: 100%;
            height: 8px;
            background: repeating-linear-gradient(
                90deg,
                #ff0000 0px,
                #ff0000 20px,
                #000 20px,
                #000 40px
            );
        }

        #file-name {
            font-size: clamp(24px, 5vw, 48px);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: -2px;
            word-break: break-all;
            text-shadow: 4px 4px 0px #ff0000;
        }

        .player-container {
            background: #111;
            border: 4px solid #fff;
            margin: 0;
            position: relative;
        }

        .video-wrapper {
            position: relative;
            background: #000;
        }

        .video-wrapper::before {
            content: 'PLAY';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 64px;
            font-weight: 800;
            color: #fff;
            text-shadow: 4px 4px 0px #ff0000;
            z-index: 1;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .video-wrapper:hover::before {
            opacity: 0.8;
        }

        video {
            width: 100%;
            height: auto;
            min-height: 300px;
            background: #000;
        }

        .controls {
            background: #ff0000;
            padding: 0;
            display: grid;
            grid-template-columns: 1fr 1fr;
            border-bottom: 4px solid #fff;
        }

        .btn {
            background: #ff0000;
            color: #fff;
            border: none;
            padding: 20px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            border-right: 2px solid #fff;
            transition: all 0.1s ease;
            position: relative;
        }

        .btn:last-child {
            border-right: none;
        }

        .btn:hover {
            background: #000;
            color: #ff0000;
            transform: translateY(-2px);
            box-shadow: 0 4px 0 #fff;
        }

        .btn:active {
            transform: translateY(0);
            box-shadow: none;
        }

        .btn i {
            margin-right: 8px;
            font-size: 18px;
        }

        .player-grid {
            background: #fff;
            color: #000;
            padding: 0;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 0;
            border-bottom: 4px solid #000;
        }

        .player-btn {
            background: #fff;
            color: #000;
            border: 2px solid #000;
            padding: 15px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.1s ease;
            border-right: none;
            border-bottom: none;
        }

        .player-btn:hover {
            background: #000;
            color: #fff;
            transform: scale(0.98);
        }

        .player-logo {
            width: 20px;
            height: 20px;
            filter: grayscale(100%) contrast(200%);
        }

        .social-grid {
            background: #000;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            border-top: 4px solid #ff0000;
        }

        .social-link {
            display: block;
            background: #fff;
            padding: 15px;
            border: 3px solid #ff0000;
            transition: all 0.1s ease;
        }

        .social-link:hover {
            background: #ff0000;
            transform: rotate(-2deg) scale(1.05);
        }

        .social-link img {
            width: 30px;
            height: 30px;
            filter: grayscale(100%) contrast(200%);
        }

        .feedback {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #ff0000;
            color: #fff;
            padding: 15px 20px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            text-transform: uppercase;
            border: 3px solid #fff;
            box-shadow: 4px 4px 0px #000;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* Plyr overrides for brutalist style */
        .plyr {
            border: 4px solid #fff !important;
        }

        .plyr--video {
            background: #000 !important;
        }

        .plyr__controls {
            background: rgba(255, 0, 0, 0.9) !important;
            border-top: 2px solid #fff !important;
        }

        .plyr__control {
            color: #fff !important;
            font-weight: 700 !important;
        }

        .plyr__control:hover {
            background: #000 !important;
        }

        .plyr__video-wrapper {
            background: #000 !important;
        }

        @media (max-width: 768px) {
            .controls {
                grid-template-columns: 1fr;
            }
            
            .player-grid {
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            }
            
            .social-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .btn {
                padding: 15px;
                font-size: 14px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1 id="file-name">VIDEO_FILE.MP4</h1>
        </header>
        
        <div class="player-container">
            <div class="video-wrapper">
                <video class="plyr" controls poster="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/well.png">
                    <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </div>
        </div>

        <div class="controls">
            <button class="btn download" onclick="download()">
                <i class="fas fa-download"></i> DOWNLOAD
            </button>
            <button class="btn copy-link" onclick="copyLink()">
                <i class="fas fa-link"></i> COPY LINK
            </button>
        </div>

        <div class="player-grid">
            <button class="player-btn" onclick="playOnline('vlc')">
                <img src="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/vlc.png" alt="VLC" class="player-logo">
                VLC
            </button>
            <button class="player-btn" onclick="playOnline('mx')">
                <img src="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/mx.png" alt="MX Player" class="player-logo">
                MX PLAYER
            </button>
            <button class="player-btn" onclick="playOnline('np')">
                <img src="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/nPlayer.webp" alt="nPlayer" class="player-logo">
                NPLAYER
            </button>
            <button class="player-btn" onclick="playOnline('sp')">
                <img src="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/splayer.webp" alt="S Player" class="player-logo">
                S PLAYER
            </button>
            <button class="player-btn" onclick="playOnline('km')">
                <img src="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/km.webp" alt="KM Player" class="player-logo">
                KM PLAYER
            </button>
        </div>

        <div class="social-grid">
            <a href="http://youtube.com/@avbotx" class="social-link">
                <img src="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/youtube.png" alt="YouTube">
            </a>
            <a href="http://GitHub.com/Botsthe" class="social-link">
                <img src="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/github.png" alt="GitHub">
            </a>
            <a href="http://t.me/BOT_OWNER26" class="social-link">
                <img src="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/telegram.png" alt="Telegram">
            </a>
            <a href="https://www.instagram.com/aman_developerr" class="social-link">
                <img src="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/instagram.png" alt="Instagram">
            </a>
        </div>
    </div>

    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const videoElement = document.querySelector('.plyr');
            new Plyr(videoElement);
        });

        const currentUrl = window.location.href;
        const finalUrl = currentUrl.replace("/watch/", "/dl/");

        function playOnline(player) {
            const playerUrls = {
                vlc: `vlc://${finalUrl}`,
                mxp: `intent:${finalUrl}#Intent;package=com.mxtech.videoplayer.pro;end`,
                mx: `intent:${finalUrl}#Intent;package=com.mxtech.videoplayer.ad;end`,
                np: `nplayer-${finalUrl}`,
                sp: `intent:${finalUrl}#Intent;action=com.young.simple.player.playback_online;package=com.young.simple.player;end`,
                km: `intent:${finalUrl}#Intent;package=com.kmplayer;end`
            };
            window.location.href = playerUrls[player] || finalUrl;
        }

        function download() {
            window.location.href = finalUrl;
        }

        function copyLink() {
            navigator.clipboard.writeText(finalUrl)
                .then(() => {
                    const feedback = document.createElement('div');
                    feedback.className = 'feedback';
                    feedback.textContent = "LINK COPIED!";
                    feedback.setAttribute("role", "alert");
                    document.body.appendChild(feedback);
                    setTimeout(() => feedback.remove(), 3000);
                })
                .catch(err => console.error('Could not copy text: ', err));
        }
    </script>
</body>
</html>
