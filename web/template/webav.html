<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta property="og:image" content="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/live.png">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MARVAL ZO | {{file_name}}</title>
    <link rel="icon" href="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/logo.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF3366;
            --secondary: #33CCFF;
            --accent1: #FFCC00;
            --accent2: #66FF99;
            --dark: #111111;
            --light: #F5F5F5;
            --shadow-offset: 4px;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: #f0f0f0;
            background-image: 
                radial-gradient(var(--accent1) 2px, transparent 2px),
                radial-gradient(var(--secondary) 2px, transparent 2px);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
            color: var(--dark);
            padding: 20px 10px;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 15px;
        }
        
        header {
            margin-bottom: 20px;
            position: relative;
        }
        
        h1 {
            font-family: 'Unbounded', cursive;
            font-size: 2rem;
            font-weight: 900;
            text-transform: uppercase;
            color: var(--dark);
            background-color: var(--accent1);
            padding: 12px 20px;
            border: 3px solid var(--dark);
            box-shadow: var(--shadow-offset) var(--shadow-offset) 0 var(--dark);
            display: inline-block;
            transform: rotate(-1deg);
            margin-bottom: 20px;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .player-container {
            margin-bottom: 25px;
            border: 5px solid var(--dark);
            box-shadow: var(--shadow-offset) var(--shadow-offset) 0 var(--dark);
            background-color: var(--secondary);
            padding: 10px;
            position: relative;
            overflow: hidden;
        }
        
        .video-wrapper {
            position: relative;
            width: 100%;
            background-color: #000;
            border: 3px solid var(--dark);
        }
        
        .plyr {
            width: 100%;
            max-height: 75vh;
        }
        
        /* Custom player styling */
        .plyr--video {
            border-radius: 0;
        }
        
        .plyr__control--overlaid {
            background: var(--primary);
            border: 2px solid var(--dark);
            box-shadow: 3px 3px 0 var(--dark);
        }
        
        .plyr__control--overlaid:hover {
            background: var(--accent1);
            transform: scale(1.1);
        }
        
        .plyr--full-ui input[type=range] {
            color: var(--primary);
        }
        
        .plyr__control.plyr__tab-focus, 
        .plyr__control:hover,
        .plyr__control[aria-expanded=true] {
            background: var(--accent1);
        }
        
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .btn {
            font-family: 'Unbounded', cursive;
            font-weight: 700;
            font-size: 1rem;
            padding: 15px 20px;
            border: 3px solid var(--dark);
            box-shadow: var(--shadow-offset) var(--shadow-offset) 0 var(--dark);
            background-color: white;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-transform: uppercase;
        }
        
        .btn:active {
            box-shadow: 1px 1px 0 var(--dark);
            transform: translate(3px, 3px);
        }
        
        .download {
            background-color: var(--accent2);
        }
        
        .copy-link {
            background-color: var(--secondary);
        }
        
        .player-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .player-btn {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            padding: 12px 15px;
            border: 3px solid var(--dark);
            box-shadow: var(--shadow-offset) var(--shadow-offset) 0 var(--dark);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background-color: white;
        }
        
        .player-btn:nth-child(1) {
            background-color: #fb7e01;
        }
        
        .player-btn:nth-child(2) {
            background-color: #7EB5FF;
        }
        
        .player-btn:nth-child(3) {
            background-color: #ffcc66;
        }
        
        .player-btn:nth-child(4) {
            background-color: #ff99cc;
        }
        
        .player-btn:nth-child(5) {
            background-color: #66ccff;
        }
        
        .player-btn:active {
            box-shadow: 1px 1px 0 var(--dark);
            transform: translate(3px, 3px);
        }
        
        .player-logo {
            width: 24px;
            height: 24px;
            object-fit: contain;
            border-radius: 0;
        }
        
        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            padding: 20px;
            background-color: var(--primary);
            border: 3px solid var(--dark);
            box-shadow: var(--shadow-offset) var(--shadow-offset) 0 var(--dark);
        }
        
        .social-links a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            background-color: white;
            border: 3px solid var(--dark);
            border-radius: 10px;
            box-shadow: 3px 3px 0 var(--dark);
            transition: all 0.2s ease;
        }
        
        .social-links a:hover {
            transform: translateY(-5px);
        }
        
        .social-links a:active {
            box-shadow: 1px 1px 0 var(--dark);
            transform: translate(2px, 2px);
        }
        
        .social-links img {
            width: 30px;
            height: 30px;
            object-fit: contain;
        }
        
        .feedback {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--accent1);
            color: var(--dark);
            padding: 15px 25px;
            border: 3px solid var(--dark);
            box-shadow: var(--shadow-offset) var(--shadow-offset) 0 var(--dark);
            font-family: 'Unbounded', cursive;
            font-weight: 700;
            border-radius: 0;
            z-index: 1000;
            animation: popIn 0.3s ease-out;
        }
        
        @keyframes popIn {
            0% { transform: translateX(-50%) scale(0.8); opacity: 0; }
            70% { transform: translateX(-50%) scale(1.1); }
            100% { transform: translateX(-50%) scale(1); opacity: 1; }
        }
        
        /* Custom Settings Panels */
        .custom-settings {
            margin-top: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .custom-settings-btn {
            background-color: var(--secondary);
            color: var(--dark);
            border: 2px solid var(--dark);
            padding: 8px 15px;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            box-shadow: 2px 2px 0 var(--dark);
        }
        
        .custom-settings-btn:hover {
            background-color: var(--accent1);
        }
        
        .custom-settings-btn:active {
            box-shadow: 1px 1px 0 var(--dark);
            transform: translate(1px, 1px);
        }
        
        .custom-panel {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background-color: rgba(255,255,255,0.9);
            border: 3px solid var(--dark);
            padding: 15px;
            z-index: 100;
            display: none;
            animation: slideUp 0.3s ease-out;
        }
        
        .custom-panel.show {
            display: block;
        }
        
        @keyframes slideUp {
            from { transform: translateY(10px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .panel-title {
            font-family: 'Unbounded', cursive;
            font-size: 1.2rem;
            font-weight: 700;
        }
        
        .close-panel {
            background: var(--primary);
            border: 2px solid var(--dark);
            color: white;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 2px 2px 0 var(--dark);
        }
        
        .close-panel:active {
            box-shadow: 1px 1px 0 var(--dark);
            transform: translate(1px, 1px);
        }
        
        .panel-content {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
        }
        
        .quality-btn, .audio-btn, .subtitle-btn {
            padding: 8px;
            background-color: white;
            border: 2px solid var(--dark);
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 500;
            cursor: pointer;
            text-align: center;
            box-shadow: 2px 2px 0 var(--dark);
            transition: all 0.2s ease;
        }
        
        .quality-btn:hover, .audio-btn:hover, .subtitle-btn:hover {
            background-color: var(--accent1);
        }
        
        .quality-btn.active, .audio-btn.active, .subtitle-btn.active {
            background-color: var(--primary);
            color: white;
        }
        
        .quality-btn:active, .audio-btn:active, .subtitle-btn:active {
            box-shadow: 1px 1px 0 var(--dark);
            transform: translate(1px, 1px);
        }

        /* Loading animation */
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
        }
        
        .spinner {
            width: 64px;
            height: 64px;
            border: 8px solid var(--accent1);
            border-top: 8px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Media info */
        .media-info {
            margin-top: 15px;
            padding: 15px;
            background-color: white;
            border: 3px solid var(--dark);
            box-shadow: var(--shadow-offset) var(--shadow-offset) 0 var(--dark);
        }
        
        .media-info-header {
            font-family: 'Unbounded', cursive;
            font-weight: 700;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .media-info-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        
        .media-info-item {
            display: flex;
            gap: 10px;
        }
        
        .media-info-label {
            font-weight: 700;
            flex-shrink: 0;
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 1.5rem;
                padding: 10px 15px;
            }
            
            .controls {
                grid-template-columns: 1fr;
            }
            
            .player-options {
                grid-template-columns: 1fr 1fr;
            }
            
            .social-links {
                flex-wrap: wrap;
            }
            
            .media-info-content {
                grid-template-columns: 1fr;
            }
            
            .custom-settings {
                justify-content: center;
            }
            
            .panel-content {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            }
        }

        .copyright {
            text-align: center;
            margin-top: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--dark);
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1 id="file-name">{{file_name}}</h1>
        </header>
        
        <div class="player-container">
            <div class="video-wrapper">
                <video id="player" crossorigin playsinline controls poster="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/well.png">

            <div class="custom-settings">

            <div class="custom-panel" id="quality-panel">
                <div class="panel-header">
                    <div class="panel-title">Select Quality</div>

            <div class="custom-panel" id="audio-panel">
                <div class="panel-header">

                    </div>
                </div>
                <div class="panel-content" id="audio-options">

            <div class="custom-panel" id="subtitle-panel">
                <div class="panel-header">
                    <div class="panel-title">Subtitles</div>
                    <div class="close-panel" data-panel="subtitle-panel">
                        <i class="fas fa-times"></i>
                    </div>
                </div>
                <div class="panel-content" id="subtitle-options">
                    <!-- Subtitle options will be added dynamically -->

            </div>
        </div>

        <div class="media-info">
            <div class="media-info-header">
                <i class="fas fa-info-circle"></i> Media Information

            <div class="media-info-content" id="media-info-content">

            </div>
        </div>

        <div class="controls">
            <button class="btn download" onclick="download()">
                <i class="fas fa-cloud-download-alt"></i> Download Now
            </button>
            <button class="btn copy-link" onclick="copyLink()">
                <i class="fas fa-link"></i> Copy Direct Link
            </button>
        </div> 
        
        <div class="player-options">
            <button class="player-btn" onclick="playOnline('vlc')">
                <img src="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/vlc.png" alt="VLC Mobile" class="player-logo"> 
                VLC Mobile
            </button>
            <button class="player-btn" onclick="playOnline('mx')">
                <img src="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/mx.png" alt="MX Player" class="player-logo"> 
                MX Player
            </button>
            <button class="player-btn" onclick="playOnline('np')">
                <img src="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/nPlayer.webp" alt="nPlayer" class="player-logo"> 
                nPlayer
            </button>
            <button class="player-btn" onclick="playOnline('sp')">
                <img src="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/splayer.webp" alt="S Player" class="player-logo"> 
                S Player
            </button>
            <button class="player-btn" onclick="playOnline('km')">
                <img src="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/km.webp" alt="KM Player" class="player-logo"> 
                KM Player
            </button>
        </div>

        <div class="social-links">
            <a href="http://youtube.com/@avbotx" aria-label="YouTube">
                <img src="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/youtube.png" alt="YouTube">
            </a>
            <a href="http://GitHub.com/Botsthe" aria-label="GitHub">
                <img src="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/github.png" alt="GitHub">
            </a>
            <a href="http://t.me/BOT_OWNER26" aria-label="Telegram">
                <img src="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/telegram.png" alt="Telegram">
            </a>
            <a href="https://www.instagram.com/aman_developerr" aria-label="Instagram">
                <img src="https://cdn.jsdelivr.net/gh/Botsthe/DATABASE@main/image/instagram.png" alt="Instagram">
            </a>

        <div class="copyright">
            © marvalzi | @Marvalzod | @drdoom
        </div>
    </div>

    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.4.0/hls.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Set up basic variables
            const videoElement = document.getElementById('player');
            const loadingOverlay = document.getElementById('loading-overlay');
            const currentUrl = window.location.href;
            const finalUrl = currentUrl.replace("/watch/", "/dl/");
            const fileName = finalUrl.split('/').pop();
            
            // Set file name in the header
            document.getElementById('file-name').textContent = decodeURIComponent(fileName);
            
            // Initialize media info default values
            const mediaInfoContent = document.getElementById('media-info-content');
            mediaInfoContent.innerHTML = `
                <div class="media-info-item">
                    <div class="media-info-label">Format:</div>
                    <div class="media-info-value" id="media-format">Detecting...</div>
                </div>
                <div class="media-info-item">
                    <div class="media-info-label">Resolution:</div>
                    <div class="media-info-value" id="media-resolution">Detecting...</div>
                </div>
                <div class="media-info-item">
                    <div class="media-info-label">Duration:</div>
                    <div class="media-info-value" id="media-duration">Calculating...</div>
                </div>
                <div class="media-info-item">
                    <div class="media-info-label">Audio Tracks:</div>
                    <div class="media-info-value" id="media-audio-tracks">Detecting...</div>
                </div>
            `;
            
            // Initialize Plyr with more controls
            const player = new Plyr(videoElement, {
                controls: [
                    'play-large', 'play', 'progress', 'current-time', 'duration',
                    'mute', 'volume', 'captions', 'settings', 'pip', 'airplay', 'fullscreen'
                ],
                settings: ['captions', 'quality', 'speed', 'loop'],
                speed: { selected: 1, options: [0.5, 0.75, 1, 1.25, 1.5, 1.75, 2, 3] },
                quality: { default: 'auto', options: ['auto', '1080p', '720p', '480p', '360p'] },
                i18n: {
                    qualityLabel: {
                        auto: 'Auto'
                    },
                },
                tooltips: { controls: true, seek: true },
                keyboard: { focused: true, global: true }
            });
            
            // Function to detect file type
            function detectFileType(url) {
                const extension = url.split('.').pop().toLowerCase();
                if (extension === 'mp4') {
                    return 'MP4 Video';
                } else if (extension === 'mkv') {
                    return 'MKV Video';
                } else if (extension === 'webm') {
                    return 'WebM Video';
                } else {
                    return 'Video File';
                }
            }
            
            // Setup custom panels
            const panels = ['quality-panel', 'audio-panel', 'subtitle-panel'];
            const buttons = ['quality-btn', 'audio-btn', 'subtitle-btn'];
            
            // Add event listeners to buttons
            buttons.forEach((btn, index) => {
                document.getElementById(btn).addEventListener('click', () => {
                    const panel = document.getElementById(panels[index]);
                    
                    // Hide all other panels
                    panels.forEach(p => {
                        if (p !== panels[index]) {
                            document.getElementById(p).classList.remove('show');
                        }
                    });
                    
                    // Toggle current panel
                    panel.classList.toggle('show');
                });
            });
            
            // Add event listeners to close buttons
            document.querySelectorAll('.close-panel').forEach(btn => {
                btn.addEventListener('click', () => {
                    const panelId = btn.getAttribute('data-panel');
                    document.getElementById(panelId).classList.remove('show');
                });
            });
            
            // Quality selection
            document.querySelectorAll('.quality-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const quality = btn.getAttribute('data-quality');
                    
                    // Update active state
                    document.querySelectorAll('.quality-btn').forEach(b => {
                        b.classList.remove('active');
                    });
                    btn.classList.add('active');
                    
                    // Set quality in player (simplified for demo)
                    console.log(`Quality selected: ${quality}`);
                    
                    // Close panel
                    document.getElementById('quality-panel').classList.remove('show');
                    
                    // Show notification
                    showFeedback(`Quality changed to ${quality}`);
                });
            });
            
            // Mock audio tracks (would be detected from video in real implementation)
            const audioTracks = [
                { id: 'audio-1', language: 'English', default: true },
                { id: 'audio-2', language: 'Hindi', default: false },
                { id: 'audio-3', language: 'Spanish', default: false }
            ];
            
            // Add audio options
            const audioOptions = document.getElementById('audio-options');
            audioOptions.innerHTML = '';
            
            audioTracks.forEach(track => {
                const btn = document.createElement('button');
                btn.className = `audio-btn ${track.default ? 'active' : ''}`;
                btn.setAttribute('data-audio-id', track.id);
                btn.textContent = track.language;
                
                btn.addEventListener('click', () => {
                    // Update active state
                    document.querySelectorAll('.audio-btn').forEach(b => {
                        b.classList.remove('active');
                    });
                    btn.classList.add('active');
                    
                    // Simulate changing audio track
                    console.log(`Audio track changed to ${track.language}`);
                    
                    // Close panel
                    document.getElementById('audio-panel').classList.remove('show');
                    
                    // Show notification
                    showFeedback(`Audio changed to ${track.language}`);
                });
                
                audioOptions.appendChild(btn);
            });
            
            // Mock subtitles (would be detected from video in real implementation)
            const subtitles = [
